<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>背书地图</title>
<style>
:root{--bg:#08090c;--card:rgba(20,23,30,.6);--card-solid:#13161c;--ink:#eaecf2;--sub:#858d9c;--line:rgba(255,255,255,.07);--brand:#7c9bff;--brand2:#b07cff;--accent:#3fd6ab;--shadow:0 10px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;background:radial-gradient(1000px 600px at 8% -10%,rgba(124,155,255,.16),transparent 62%),radial-gradient(900px 700px at 92% 4%,rgba(176,124,255,.13),transparent 62%),radial-gradient(800px 600px at 50% 108%,rgba(63,214,171,.09),transparent 62%),#08090c;background-attachment:fixed}
body.light{--bg:#f4f6fa;--card:rgba(255,255,255,.78);--card-solid:#fff;--ink:#14181f;--sub:#6b7280;--line:rgba(20,24,31,.07);--shadow:0 10px 34px rgba(20,24,31,.07)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:600;font-size:14px;padding:11px 20px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transition:.18s;box-shadow:0 5px 18px rgba(124,155,255,.3)}
button:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(124,155,255,.42)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.05);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
body.light button.ghost{background:#fff}
button.ghost:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
button.soft{background:rgba(255,255,255,.04);color:var(--sub);box-shadow:none;border:1px solid var(--line)}
button.danger{background:rgba(248,113,113,.12);color:var(--l2);box-shadow:none;border:1px solid rgba(248,113,113,.25)}
button.sm{padding:6px 13px;font-size:12.5px;border-radius:10px;flex-shrink:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 100px}
.hero{position:relative;margin:22px 0 26px;border-radius:32px;padding:38px 38px 32px;overflow:hidden;background:linear-gradient(135deg,rgba(124,155,255,.15),rgba(176,124,255,.11) 48%,rgba(63,214,171,.09)),var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);letter-spacing:1.2px;text-transform:uppercase}
.hero-top .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-motto{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);opacity:.86;letter-spacing:.6px;margin-bottom:8px;font-weight:500}
.hero-motto .m-ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;background:linear-gradient(135deg,var(--l5),var(--brand));color:#fff;flex:0 0 auto;box-shadow:0 3px 10px rgba(63,214,171,.3)}
.hero-num{font-size:min(88px,16vw);font-weight:800;letter-spacing:-3.5px;line-height:1.04;margin:14px 0 4px;background:linear-gradient(120deg,#fff 8%,#c8d6ff 46%,#e6d4ff 86%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.light .hero-num{background:linear-gradient(120deg,#14181f,#3b4a7a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:14.5px;color:var(--sub);margin-bottom:4px}
.hero-quote{margin-top:6px;font-size:15.5px;color:var(--ink);letter-spacing:.2px;min-height:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-quote .q{opacity:.5;font-size:13px;color:var(--sub);font-style:normal}
.hero-row{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
.hero-cell{flex:1;min-width:104px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:.2s;cursor:pointer}
.hero-cell:hover{background:rgba(255,255,255,.075);transform:translateY(-2px)}
body.light .hero-cell:hover{background:rgba(0,0,0,.035)}
.hero-cell b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero-cell span{font-size:10.5px;color:var(--sub);letter-spacing:.8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;box-shadow:var(--shadow);transition:.25s;cursor:pointer}
.stat:hover{transform:translateY(-3px);border-color:rgba(124,155,255,.3);background:rgba(124,155,255,.06)}
body.light .stat:hover{background:rgba(124,155,255,.04)}
.stat b{display:block;font-size:30px;font-weight:800;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.stat span{font-size:11px;color:var(--sub);letter-spacing:.8px;margin-top:5px;display:block}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:700;margin-bottom:18px}
.card-h .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(124,155,255,.3)}
.ch-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.due-item{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;flex-wrap:wrap;font-size:14px;transition:.2s}
body.light .due-item{background:rgba(0,0,0,.012)}
.due-item:hover{border-color:rgba(124,155,255,.28);background:rgba(255,255,255,.06)}
.due-item.done{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.055)}
.due-item.done .nm{text-decoration:line-through;color:var(--sub)}
.due-item .nm{flex:1;min-width:140px;font-weight:600;font-size:14.5px}
.due-item .meta{font-size:11.5px;color:var(--sub);width:100%;margin-top:3px}
.due-item .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;transition:.18s;margin-top:2px;font-size:14px;color:transparent}
.due-item .ck:hover{border-color:var(--brand)}
.due-item.done .ck{background:var(--l5);border-color:var(--l5);color:#fff}
.note-box{width:100%;margin-top:12px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font-size:13px;background:rgba(255,255,255,.035);color:var(--ink);font-family:inherit;resize:vertical;min-height:38px;display:block}
body.light .note-box{background:rgba(0,0,0,.012)}
.note-box:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.14)}
.note-box::placeholder{color:var(--sub);font-size:12.5px}
.note-tag{display:inline-block;font-size:10.5px;color:var(--l3);margin-top:8px;font-weight:600}
.progress-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.progress-bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
body.light .progress-bar{background:rgba(0,0,0,.06)}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--l5),var(--brand));border-radius:8px;transition:width .4s ease}
.progress-txt{font-size:12.5px;color:var(--sub);white-space:nowrap}
.progress-txt b{color:var(--l5);font-size:15px}
.lvl-btns{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.lvl-btns button{width:34px;height:32px;padding:0;font-size:12px;border-radius:9px;color:#fff;border:2px solid transparent;box-shadow:none;transition:.15s;flex-shrink:0}
.lvl-btns button:hover{transform:scale(1.14)}
.lvl-btns button.l1{background:#c084fc}.lvl-btns button.l2{background:#f87171}.lvl-btns button.l3{background:#e0a82e}.lvl-btns button.l4{background:#22c55e}.lvl-btns button.l5{background:#e0a82e}
.empty{padding:28px;text-align:center;color:var(--sub);font-size:13.5px}
.over{color:var(--l2)!important;font-weight:600}
.soon{color:var(--l3)!important;font-weight:600}
.heat-scroll{overflow-x:auto;padding:4px 0 8px}
.heat-month{display:flex;gap:5px;margin-bottom:6px;padding-left:40px;font-size:10.5px;color:var(--sub);letter-spacing:.5px}
.heat-month span{flex:1;text-align:center}
.heat-grid{display:flex;gap:5px}
.heat-col{display:flex;flex-direction:column;gap:5px}
.heat-cell{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.055);cursor:pointer;transition:.16s;position:relative}
body.light .heat-cell{background:rgba(0,0,0,.045)}
.heat-cell:hover{transform:scale(1.55);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.heat-cell[data-l="1"]{background:#c084fc}.heat-cell[data-l="2"]{background:#f87171}.heat-cell[data-l="3"]{background:#e0a82e}.heat-cell[data-l="4"]{background:#22c55e}.heat-cell[data-l="5"]{background:#e0a82e}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin:0 2px}
.heat-tip{position:fixed;z-index:99;background:#0b0d12;color:#fff;padding:7px 12px;border-radius:10px;font-size:11.5px;pointer-events:none;opacity:0;transition:.12s;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1)}
.heat-tip.on{opacity:1}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cat-card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-4px);border-color:rgba(124,155,255,.35);box-shadow:0 14px 36px rgba(0,0,0,.35)}
body.light .cat-card:hover{box-shadow:0 14px 36px rgba(20,24,31,.1)}
.cat-card .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin:14px 0 8px;overflow:hidden}
body.light .cat-card .bar{background:rgba(0,0,0,.06)}
.cat-card .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.cat-card h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.cat-card .cnt{font-size:12.5px;color:var(--sub)}
.cat-card .arrow{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:20px;transition:.2s}
.cat-card:hover .arrow{color:var(--brand);transform:translateY(-50%) translateX(4px)}
.point{display:flex;align-items:flex-start;gap:12px;padding:14px 6px;border-bottom:1px dashed var(--line);transition:.18s;border-radius:10px}.point.focus{background:rgba(124,155,255,.07);box-shadow:inset 3px 0 0 var(--brand)}
.point:hover{background:rgba(255,255,255,.025);padding-left:12px}
body.light .point:hover{background:rgba(0,0,0,.012)}
.point:last-child{border-bottom:none}
.point .lvl{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.09);flex:0 0 auto;margin-top:7px;transition:.2s}
body.light .point .lvl{background:rgba(0,0,0,.09)}
.point .lvl[data-l="1"]{background:#c084fc;box-shadow:0 0 10px rgba(192,132,252,.5)}
.point .lvl[data-l="2"]{background:#f87171;box-shadow:0 0 10px rgba(248,113,113,.45)}
.point .lvl[data-l="3"]{background:#e0a82e;box-shadow:0 0 10px rgba(224,168,46,.4)}
.point .lvl[data-l="4"]{background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.45)}
.point .lvl[data-l="5"]{background:#e0a82e;box-shadow:0 0 10px rgba(224,168,46,.4)}
.point .info{flex:1 1 auto;min-width:0;cursor:pointer}.point .info .nm{white-space:normal;word-break:break-word}
.point .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.point .prev{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7;display:none;padding:12px 14px;background:rgba(255,255,255,.03);border-radius:11px;border:1px solid var(--line)}
body.light .point .prev{background:rgba(0,0,0,.015)}
.point.expanded .prev{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.point .acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.point.sel{background:rgba(124,155,255,.09);padding-left:12px;border-radius:10px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.4px}
.tm{background:rgba(34,197,94,.16);color:#4ade80}.ts{background:rgba(59,130,246,.18);color:#7aa7ff}.td{background:rgba(224,168,46,.18);color:#f0c068}.to{background:rgba(192,132,252,.18);color:#d4adff}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 20px;font-size:13.5px;font-weight:600;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--sub);cursor:pointer;transition:.18s}
.tab:hover{background:rgba(255,255,255,.08)}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 5px 16px rgba(124,155,255,.32)}
.map-grid{display:grid;gap:5px}
.map-cell{height:17px;border-radius:5px;background:rgba(255,255,255,.055);cursor:pointer;transition:.16s;position:relative}
body.light .map-cell{background:rgba(0,0,0,.045)}
.map-cell:hover{transform:scale(1.5);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.map-cell[data-note="1"]{outline:2px solid var(--l3)}
.rich{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
body.light .rich{background:rgba(0,0,0,.015)}
.rich .tb{display:flex;gap:5px;padding:8px 10px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line);flex-wrap:wrap}
body.light .rich .tb{background:rgba(0,0,0,.02)}
.rich .tb button{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);padding:4px 11px;font-size:12px;border-radius:8px;box-shadow:none}
body.light .rich .tb button{background:#fff}
.rich .tb button:hover{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;transform:none}
.rich [contenteditable]{min-height:190px;padding:15px 17px;font-size:14.5px;outline:none;line-height:1.85}
.rich [contenteditable]:empty:before{content:attr(data-ph);color:var(--sub);font-size:13.5px}
.mask{position:fixed;inset:0;background:rgba(4,5,8,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card-solid);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:26px;width:100%;max-width:660px;box-shadow:0 28px 80px rgba(0,0,0,.55)}
.modal h3{font-size:19px;margin-bottom:18px;font-weight:800}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;letter-spacing:.8px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit}
body.light .field input,body.light .field select,body.light .field textarea{background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.15)}
.field textarea{min-height:80px;resize:vertical;line-height:1.7}
.modal-acts{display:flex;gap:12px;margin-top:10px}
.modal-acts button{flex:1}
.batchbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(124,155,255,.14),rgba(176,124,255,.1));border:1px solid rgba(124,155,255,.3);border-radius:14px;padding:12px 16px;margin-bottom:16px;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}
.batchbar.on{display:flex}
.batchbar .cnt{font-size:13px;color:var(--ink);font-weight:600}
.batchbar select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:13px}
body.light .batchbar select{background:#fff}
body.light .batchbar{background:rgba(124,155,255,.06)}
.chk-wrap{display:none;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 auto;margin-top:2px}
.batch .chk-wrap{display:flex}
.batch .ck-hide{display:none!important}
.chk-wrap input{width:18px;height:18px;cursor:pointer;accent-color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--brand);cursor:pointer;margin-bottom:18px;font-weight:600}
.back:hover{color:var(--brand2)}
.topbar{position:sticky;top:0;z-index:40;padding:14px 0;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(8,9,12,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
body.light .topbar{background:rgba(244,246,250,.85)}
.topbar .logo{font-weight:800;font-size:16.5px;margin-right:auto;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.topbar input{flex:1;min-width:160px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;margin:0;transition:.18s}
body.light .topbar input{background:#fff}
.topbar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.14)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#0b0d12;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;box-shadow:0 14px 36px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);opacity:0;transition:.26s;z-index:120}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page{display:none}
.page.on{display:block;animation:pg .3s ease}
@keyframes pg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.note-list{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.note-list .nl-item{display:flex;gap:10px;padding:9px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.05)}
body.light .note-list .nl-item{border-bottom-color:rgba(0,0,0,.05)}
.note-list .nl-date{font-family:monospace;font-size:12px;color:var(--sub);min-width:92px;flex-shrink:0}
.note-list .nl-text{flex:1;color:var(--ink);line-height:1.65}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px dashed var(--line);transition:.18s;border-radius:10px}
.list-item:hover{background:rgba(255,255,255,.025);padding-left:12px}
body.light .list-item:hover{background:rgba(0,0,0,.012)}
.list-item:last-child{border-bottom:none}
.list-item .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:28px 0;letter-spacing:.6px}

 }
 h+='</div>';

 setTimeout(function(){try{enRenderHomeCard();}catch(e){console.error('enCard',e);}},0);

function renderDueBatchBar(){
 var sch='<option value="">改章节 →</option>'+chapters.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');
 var ca='<option value="">改题型 →</option><option>名词解释</option><option>简答</option><option>论述</option><option>其他</option>';
 return '<div class="batchbar on" style="position:static;margin-bottom:12px"><span class="cnt">已选 '+Object.keys(dueBatchSel).length+' 条</span><select onchange="dueBatchMove(\'chapter\',this.value)">'+sch+'</select><select onchange="dueBatchMove(\'category\',this.value)">'+ca+'</select><button class="danger sm" onclick="dueBatchDel()">删除所选</button><button class="ghost sm" onclick="dueBatch=false;dueBatchSel={};renderHome()">取消</button></div>';
}
function renderDueList(){
 var list=dueList();
 if(!list.length)return '<div class="empty">今天没有按记忆曲线到点的复习 去首背几个新的吧</div>';
 var h='';
 list.forEach(function(o){
  var p=o.point;var overdue=o.first&&o.first<ts()&&lastLevel(p.id)>0;
  var done=!!doneToday[p.id];
  var n=pointNotes(p.id)[0];
  h+='<div class="due-item'+(done?' done':'')+'">';
  if(dueBatch){
   h+='<div class="chk-wrap" style="display:flex"><input type="checkbox"'+(dueBatchSel[p.id]?' checked':'')+' onclick="if(this.checked)dueBatchSel[this.dataset.id]=1;else delete dueBatchSel[this.dataset.id];" data-id="'+p.id+'"></div>';
  }else{
   h+='<div class="ck'+(done?' on':'')+'" onclick="toggleDone('+p.id+')">'+(done?'&#10003;':'')+'</div>';
  }
  h+='<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="nm" style="font-weight:600;font-size:14.5px;flex:1;min-width:120px">'+esc(p.name)+'</span>'+tagOf(p.category)+'</div>';
  h+='<div class="meta '+(lastLevel(p.id)===0||overdue?'over':'soon')+'">'+esc(chName(p.chapter_id))+' 首背 '+o.first+(overdue?' · 已逾期':'')+(n?' · '+pointNotes(p.id).length+' 条卡点备注':'')+'</div>';
  h+='<textarea class="note-box" placeholder="这里写容易卡壳、需要特别注意的地方，输入后自动保存…" oninput="onNote('+p.id+',this.value)">'+(n?n.content:'')+'</textarea>'+(n?'<div class="note-tag has">最近一次：'+n.note_date+'</div>':'')+'</div>';
  h+='<div class="acts" onclick="event.stopPropagation()">'+(dueBatch?'':('<button class="ghost sm" onclick="nav(\'detail/'+p.id+'\')" title="详情与卡点">注</button><span class="lvl-btns"><button class="l1" onclick="quickReview('+p.id+',1)">遗</button><button class="l2" onclick="quickReview('+p.id+',2)">糊</button><button class="l3" onclick="quickReview('+p.id+',3)">熟</button><button class="l4" onclick="quickReview('+p.id+',4)">背</button><button class="l5" onclick="quickReview('+p.id+',5)">卡</button></span>'))+'</div></div>';
 });
 var donec=list.filter(function(o){return doneToday[o.point.id];}).length;
 h+='<div class="progress-row"><div class="progress-bar"><i style="width:'+Math.round(donec/list.length*100)+'%"></i></div><div class="progress-txt">已完成 <b>'+donec+'</b> / '+list.length+' 条</div></div>';
 return h;
}
function toggleDone(id){
 if(doneToday[id]){delete doneToday[id];}
 else{doneToday[id]=1;toast('完成！+1');}
 renderHome();
}
function doneAll(){
 var list=dueList();
 if(!list.length){toast('今天没有待复习的');return;}
 list.forEach(function(o){doneToday[o.point.id]=1;});
 renderHome();toast('已全部标记完成 '+list.length+' 条');
}
function dueBatchMove(field,val){
 var ks=Object.keys(dueBatchSel).filter(function(k){return dueBatchSel[k];});
 if(!ks.length){toast('先勾选知识点');return;}
 if(!val){return;}
 var body={};body[field]=field==='chapter'?+val:val;
 ks.forEach(function(id){
  var p=points.filter(function(x){return x.id==id;})[0];if(!p)return;
  Object.assign(p,body);
  rest('/kb_points?id=eq.'+p.id,'PATCH',body);
 });
 dueBatchSel={};dueBatch=false;renderHome();toast('已更新 '+ks.length+' 条');
}
function dueBatchDel(){
 var ks=Object.keys(dueBatchSel).filter(function(k){return dueBatchSel[k];});
 if(!ks.length){toast('先勾选要删除的知识点');return;}
 if(!confirm('确定删除这 '+ks.length+' 条知识点？'))return;
 var left=ks.length;
 ks.forEach(function(id){
  rest('/kb_notes?point_id=eq.'+id,'DELETE').then(function(){return rest('/kb_reviews?point_id=eq.'+id,'DELETE');})
  .then(function(){return rest('/kb_points?id=eq.'+id,'DELETE');})
  .then(function(){
   points=points.filter(function(p){return p.id!=id;});reviews=reviews.filter(function(r){return r.point_id!=id;});notes=notes.filter(function(n){return n.point_id!=id;});delete metas[id];
   if(--left<=0){dueBatchSel={};dueBatch=false;renderHome();toast('已删除 '+ks.length+' 条');}
  });
 });
}
var noteTimers={};
function onNote(id,val){
 clearTimeout(noteTimers[id]);
 var v=val.trim();
 noteTimers[id]=setTimeout(function(){
  var nd=pointNotes(id)[0];
  if(nd){
   if(!v){rest('/kb_notes?id=eq.'+nd.id,'DELETE').then(function(){notes=notes.filter(function(x){return x.id!=nd.id;});});return;}
   rest('/kb_notes?id=eq.'+nd.id,'PATCH',{content:v}).then(function(){nd.content=v;});
  }else if(v){
   rest('/kb_notes?select=*','POST',{point_id:id,review_id:null,note_date:ts(),content:v}).then(function(r){if(r&&r[0])notes.unshift(r[0]);});
  }
 },1200);
}
function renderMapCells(){
 var grid=document.getElementById('mapGrid');if(!grid)return;
 var list=points.filter(function(p){return mapCh==0||p.chapter_id==mapCh;});
 grid.innerHTML='';
 var cols=Math.max(10,Math.min(24,Math.ceil(Math.sqrt(list.length*1.5))));
 grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
 var faded=0;
 list.forEach(function(p){
  var el=document.createElement('div');el.className='map-cell';
  var c=fadeColor(p.id);var days=fadeDays(p.id);
  if(c)el.style.background=c;else el.style.background='rgba(255,255,255,.055)';
  if(days>=1&&days<=14)faded++;
  if(pointNotes(p.id).length)el.setAttribute('data-note','1');
  var l=lastLevel(p.id);
  el.title=p.name+' · '+esc(chName(p.chapter_id))+(l?LVL[l]+' · ':'')+(days<0?'未首背':days===0?'今天背熟':days+' 天前 · 正在褪色');
  el.onclick=function(){nav('detail/'+p.id);};
  grid.appendChild(el);
 });
 var begun=list.filter(function(p){return firstDate(p.id);}).length;
 var duec=list.filter(function(p){return firstDate(p.id)&&isDue(p.id);}).length;
 document.getElementById('mapTag').textContent='共 '+list.length+' 个 · 已首背 '+begun+' 个 · 待复习 '+duec+' 个 · 褪色 '+faded+' 个';
}
function renderHeatCells(){
 var grid=document.getElementById('heatGrid');var mon=document.getElementById('heatMonth');
 if(!grid)return;
 grid.innerHTML='';mon.innerHTML='';
 var start=new Date(today);start.setDate(today.getDate()-23 * 7);start.setDate(start.getDate()-start.getDay());start.setHours(0,0,0,0);
 var dayMap={};
 reviews.forEach(function(r){var k=r.review_date;if(!dayMap[k]||dayMap[k]<r.level)dayMap[k]=r.level;});
 var ml=[];var lastM=-1;
 for(var w=0;w<24;w++){
  var d0=new Date(start);d0.setDate(start.getDate()+w*7);d0.setHours(0,0,0,0);
  var m=d0.getMonth();ml.push(m!==lastM?d0.toLocaleDateString('zh-CN',{month:'short'}):'');lastM=m;
 }
 ml.forEach(function(mm){mon.innerHTML+='<span>'+mm+'</span>';});
 for(var w2=0;w2<24;w2++){
  var col='<div class="heat-col">';
  for(var dow=0;dow<7;dow++){
   var d=new Date(start);d.setDate(start.getDate()+w2 * 7+dow);d.setHours(0,0,0,0);
   var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
   var l=dayMap[k]||0;
   var cnt=reviews.filter(function(r){return r.review_date===k;}).length;
   col+='<div class="heat-cell'+(l?'" data-l="'+l+'"':'"')+' data-date="'+k+'" data-cnt="'+cnt+'" data-lvl="'+(l?LVL[l]:'未背')+'"></div>';
  }
  col+='</div>';grid.innerHTML+=col;
 }
 var tip=document.getElementById('tip');
 document.querySelectorAll('.heat-cell').forEach(function(c){
  c.onmouseenter=function(){tip.innerHTML=c.dataset.date+' '+c.dataset.cnt+' 条 最高 '+c.dataset.lvl;tip.classList.add('on');};
  c.onmousemove=function(e){tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-34+'px';};
  c.onmouseleave=function(){tip.classList.remove('on');};
  c.onclick=function(){nav('day/'+c.dataset.date);};
 });
}

function pointRow(p,cid){

 var chk='';
 if(chBatch==cid){

{"id":101,"layer":1,"cat":"skeleton","key":"skel-letter","name":"书信通用骨架（所有书信共用）","pri":1,"fixed":"Dear [称呼],\n\nI am writing to [写信目的]. I would like to provide you with some details concerning [主题].\n\nTo begin with, [要点一]. In addition, [要点二]. Finally, [要点三].\n\nI hope this information will be helpful. Please feel free to contact me if you need any further information. I look forward to your reply.\n\nYours sincerely,\nLi Ming","fixedNotes":"固定背诵句：I am writing to… / I would like to provide you with some details concerning… / To begin with… In addition… Finally… / Please feel free to contact me if you need any further information.","howto":"来意 → 三点展开 → 礼貌收尾。任何书信先把这个骨架默写顺，再按题型改第一段和结尾。","notes":"这是基础骨架，不是所有书信的最终答案。感谢信、道歉信、祝贺信必须按情感目的改第一段和结尾，不能原样套。","check":"① 格式正确 ② 题目要点是否一一写到 ③ 时态/单复数/主谓一致 ④ 语气符合收信人身份 ⑤ 词数与拼写标点","prompt":"默写这封骨架：给同学写一封信，目的是推荐一本好书，要点是「内容好 / 易读 / 适合入门」。只填骨架，不写完整内容。"},
{"id":102,"layer":1,"cat":"skeleton","key":"skel-notice","name":"通知 / 招募启事格式（标题+主体+日期）","pri":4,"fixed":"Notice\n\nTo [通知目的], [发布主体] is going to organize [活动名称]. The event will take place at [地点] on [时间].\n\nDuring the event, participants will [活动内容]. We are also looking for [招募对象], who are expected to [职责或要求]. Those who are interested are welcome to [报名方式] before [截止日期].\n\nWe look forward to your participation.\n\n[发布主体]\n[日期]","fixedNotes":"格式四件套：标题 Notice / 发布主体与目的 / 时间地点活动内容 / 报名方式+截止日期。以学生会名义发布，结尾写 The Students' Union，不要写 Yours sincerely。","howto":"先背格式四件套，再填具体内容。招募类必须写出职责、要求、报名方式和截止日期。","notes":"如果题目是招募志愿者，正文必须明确写出职责、要求、报名方式和截止日期，不能只写「欢迎大家参加」。","check":"① 标题 ② 发布主体 ③ 时间/地点 ④ 活动内容 ⑤ 职责要求 ⑥ 报名方式 ⑦ 截止日期","prompt":"默写这封通知骨架：学生会要组织一场英语演讲比赛，需要招募 5 名志愿者做现场引导，截止 10 月 25 日。"},
{"id":103,"layer":1,"cat":"skeleton","key":"skel-minutes","name":"会议纪要格式（讨论+决议+行动项）","pri":5,"fixed":"Minutes of the Meeting\n\nDate: [日期]\nTime: [时间]\nVenue: [地点]\nParticipants: [参会人员]\n\nMain Topics and Discussion\nThe meeting focused on [会议主题]. First, the participants discussed [议题一] and agreed that [主要结论]. Next, they considered [议题二] and decided to [具体决定].\n\nDecisions and Action Items\nIt was agreed that [任务一] would be completed by [负责人] before [期限]. In addition, [负责人] would be responsible for [任务二].\n\nThe meeting ended with a clear plan for the next steps.","fixedNotes":"核心不是抒情，是准确记录：讨论内容 / 决定 / 后续任务。必备词组：focus on / discuss / agree that / decide to / be responsible for / action items / before the deadline。","howto":"记录四要素：时间地点参会人 / 讨论事项 / 决定 / 行动项（谁负责、何时完成）。","notes":"会议纪要不按书信三段式。题目要求记录会议时间、地点、参会人员和决议时，必须把这些写出来。","check":"① 会议基本信息完整 ② 讨论事项 ③ 决定 ④ 行动项（负责人+期限）","prompt":"默写纪要骨架：班委会议讨论「期中考试复习安排」，决定由学习委员整理资料，班长负责通知，截止本周五。"},

/* ---------------- L2 体裁模板 ---------------- */
{"id":201,"layer":2,"cat":"suggest","key":"lt-suggest","name":"建议信（高频）","pri":2,"fixed":"I am writing to offer some suggestions concerning [主题]. I hope the following advice will be helpful.\n\nTo begin with, I strongly recommend that you [建议一]. In addition, it would be beneficial to [建议二]. Finally, you should also pay attention to [建议三], which may help you achieve better results.\n\nI sincerely hope that you will find these suggestions useful. Please feel free to contact me if you need any further assistance.","fixedNotes":"固定句：I strongly recommend that you… / It would be beneficial to… / pay attention to… / achieve better results.","grammar":"recommend that you + 动词原形，如 recommend that you focus，不要写 focuses。","topics":["给同学建议如何提高英语写作","给学弟学妹建议如何准备考研","给图书馆建议改善阅读环境"],"notes":"建议信的核心是「具体可执行的建议」，不要空喊口号。每条建议都要能落到动作上。","check":"① 格式 ② 三条建议是否具体 ③ recommend 后接动词原形 ④ 语气礼貌 ⑤ 结尾是否邀请对方联系","prompt":"写一封建议信：你的朋友准备考研，请你给他 3 条具体建议。"},
{"id":202,"layer":2,"cat":"invite","key":"lt-invite","name":"邀请信（高频）","pri":2,"fixed":"I am delighted to invite you to [活动名称], which will be held at [地点] on [时间]. I believe your participation would make the event more meaningful.\n\nThe event is intended to [活动目的]. During the event, participants will [活动内容]. I would also be grateful if you could [希望对方承担的任务或角色].\n\nI sincerely hope you can join us. I look forward to your reply.","fixedNotes":"固定句：I am delighted to invite you to… / which will be held at… on… / The event is intended to… / your participation would make the event more meaningful.","topics":["邀请外教担任英语演讲比赛评委","邀请校友回校做职业规划讲座","邀请朋友参加毕业十周年聚会"],"notes":"邀请信必须把时间、地点、活动内容写清，并说明希望对方承担的角色或任务。","check":"① 格式 ② 时间地点明确 ③ 活动目的 ④ 对方角色 ⑤ 期待回复","prompt":"写一封邀请信：邀请一位教授来参加你校的学术论坛并做主题发言。"},
{"id":203,"layer":2,"cat":"recommend","key":"lt-recommend","name":"推荐信（高频）","pri":2,"fixed":"I am writing to recommend [人或事物] to you, as I believe it would be a suitable choice for [目的].\n\nTo begin with, [推荐对象] is particularly appealing because [理由一]. In addition, it can help you [理由二]. Considering these advantages, I believe it is well worth your attention.\n\nI hope my recommendation will be helpful to you. Please feel free to contact me if you need further information.","fixedNotes":"固定句：I am writing to recommend… / be a suitable choice for… / be particularly appealing because… / be well worth your attention.","topics":["推荐一本书给正在备考的朋友","推荐一位同学申请研究生","推荐一座城市作为旅游目的地"],"notes":"推荐信要有真实感：理由一 + 理由二 必须具体，不能只堆形容词。","check":"① 格式 ② 推荐对象明确 ③ 两个理由具体 ④ 与推荐目的吻合","prompt":"写一封推荐信：向你的老师推荐一位同学申请他门下的研究生。"},
{"id":204,"layer":2,"cat":"inquire","key":"lt-inquire","name":"咨询信","pri":3,"fixed":"I am writing to inquire about [咨询主题], as I would like to obtain some further information.\n\nTo begin with, could you please tell me [问题一]? In addition, I would like to know [问题二]. Finally, could you clarify [问题三]?\n\nI would appreciate it if you could reply at your earliest convenience. Thank you for your time and assistance.","fixedNotes":"固定句：I am writing to inquire about… / could you please tell me…? / I would like to know… / I would appreciate it if you could…","topics":["咨询夏令营的报名条件与费用","咨询交换生项目的申请流程","咨询图书馆的借阅规则"],"notes":"咨询信就是「礼貌地问三个问题」，问题要具体、可回答。","check":"① 格式 ② 三个问题具体 ③ 语气礼貌 ④ 结尾致谢","prompt":"写一封咨询信：你想参加某大学的暑期夏令营，咨询报名条件和所需材料。"},
{"id":205,"layer":2,"cat":"apology","key":"lt-apology","name":"道歉信","pri":3,"fixed":"Please accept my sincere apology for [道歉事项]. I am truly sorry for any inconvenience this may have caused.\n\nUnfortunately, [解释原因], which made it impossible for me to [未能完成的事情]. To make up for this, I would like to [补救措施].\n\nI sincerely hope you can understand my situation and accept my apology. Thank you for your understanding.","fixedNotes":"固定句：Please accept my sincere apology for… / any inconvenience this may have caused / To make up for this,… / I sincerely hope you can understand my situation.","topics":["为爽约朋友的聚会道歉","为迟交作业道歉","为损坏借阅的书道歉"],"notes":"道歉信三要素：道歉 + 原因 + 补救。原因要合理，补救措施要具体。","check":"① 格式 ② 道歉明确 ③ 原因合理 ④ 补救措施具体 ⑤ 请求谅解","prompt":"写一封道歉信：你答应帮同学带资料却忘了，为此道歉并提出补救。"},
{"id":206,"layer":2,"cat":"gratitude","key":"lt-gratitude","name":"感谢信","pri":3,"fixed":"I am writing to express my sincere gratitude for your help with [具体事情]. Your support has meant a great deal to me.\n\nThanks to your assistance, I was able to [取得的结果]. I particularly appreciate the time and effort you devoted to [具体帮助], which made a real difference.\n\nThank you again for your kindness and support. I wish you all the best.","fixedNotes":"固定句：express my sincere gratitude for… / Your support has meant a great deal to me. / Thanks to your assistance,… / made a real difference.","topics":["感谢老师的指导帮助","感谢朋友在你生病时的照顾","感谢实习单位给予的机会"],"notes":"感谢信要「具体」：感谢什么、带来什么结果，不能泛泛说谢谢。","check":"① 格式 ② 感谢的具体事情 ③ 结果 ④ 再次致谢 ⑤ 祝福","prompt":"写一封感谢信：感谢你的导师在你写论文期间给予的指导。"},
{"id":207,"layer":2,"cat":"apply","key":"lt-apply","name":"申请信","pri":3,"fixed":"I am writing to apply for [职位或项目]. I am very interested in this opportunity and believe that my qualifications make me a suitable candidate.\n\nTo begin with, I have acquired relevant knowledge in [领域]. In addition, I have developed strong [技能一] and [技能二] through [经历]. I am also responsible and willing to learn, which would help me contribute to the program.\n\nI would appreciate the opportunity to be considered for this position. I look forward to your reply.","fixedNotes":"固定句：I am writing to apply for… / my qualifications make me a suitable candidate / acquire relevant knowledge / contribute to the program.","topics":["申请一份实习","申请加入学生会","申请奖学金"],"notes":"申请信的核心是「资历与岗位匹配」，三个支撑点：知识 / 技能 / 态度。","check":"① 格式 ② 申请的职位/项目 ③ 知识+技能+态度 ④ 表达意愿","prompt":"写一封申请信：你申请某公司的暑期实习岗位。"},
{"id":208,"layer":2,"cat":"complaint","key":"lt-complaint","name":"投诉信","pri":3,"fixed":"Dear Sir or Madam,\n\nI am writing to express my dissatisfaction with [商品或服务]. Unfortunately, [具体问题] has caused considerable inconvenience.\n\nTo begin with, [问题一]. Furthermore, [问题二]. I would therefore appreciate it if you could [希望对方采取的措施], so that this matter can be resolved as soon as possible.\n\nI look forward to your response and a satisfactory solution.\n\nYours faithfully,\nLi Ming","fixedNotes":"固定句：express my dissatisfaction with… / cause considerable inconvenience / resolve this matter / a satisfactory solution. 注意落款是 Yours faithfully（不知道对方姓名时用）。","topics":["投诉网购的商品质量问题","投诉食堂卫生问题","投诉宿舍噪音"],"notes":"投诉信要客观、具体，既指出问题也提出你希望对方采取的措施。","check":"① 格式（Yours faithfully）② 问题具体 ③ 希望采取的措施 ④ 语气不过激","prompt":"写一封投诉信：你网购的一件衣服有质量问题，要求退换。"},
{"id":209,"layer":2,"cat":"congrat","key":"lt-congrat","name":"祝贺信","pri":5,"fixed":"Congratulations on your achievement in [领域或具体事件]! I was delighted to hear the good news.\n\nYour success is a reflection of your hard work and dedication. I am confident that this achievement will encourage you to pursue even greater goals.\n\nOnce again, congratulations on your well-deserved success. I wish you all the best in the future.","fixedNotes":"固定句：Congratulations on…! / a reflection of your hard work and dedication / pursue even greater goals / well-deserved success.","topics":["祝贺朋友考研成功","祝贺同学获得奖学金","祝贺老师出版新书"],"notes":"祝贺信语气要真诚热烈，重点是肯定对方的努力。","check":"① 格式 ② 祝贺的具体事件 ③ 肯定努力 ④ 祝福未来","prompt":"写一封祝贺信：你的朋友成功考取了理想的研究生院校。"},
{"id":210,"layer":2,"cat":"resign","key":"lt-resign","name":"辞职信","pri":5,"fixed":"I am writing to formally resign from my position as [职位] at [单位], effective [日期].\n\nI have decided to [离职原因，如 pursue further academic studies]. I truly appreciate the opportunities and experience I have gained here, and I will do my best to complete the handover process before my departure.\n\nI want to apologize for any inconvenience this may cause and thank you for your support during my time here.","fixedNotes":"辞职专用语料：formally resign from my position / pursue further academic studies / complete the handover process / apologize for any inconvenience caused.","topics":["辞职去继续深造","辞职换一份更适合的工作"],"notes":"辞职信语气要克制、得体，肯定收获、致谢、承诺交接。","check":"① 格式 ② 离职原因 ③ 承诺交接 ④ 致歉与致谢","prompt":"写一封辞职信：你决定辞职去读研，提前一个月告知。"},
{"id":211,"layer":2,"cat":"job","key":"lt-job","name":"求职信","pri":5,"fixed":"I am writing to express my keen interest in the [职位] advertised on [渠道]. I believe my qualifications align with your requirements.\n\nI have acquired relevant knowledge and developed strong [技能] through [经历]. I would appreciate the opportunity to attend an interview at your convenience.\n\nI look forward to your reply and the possibility of contributing to your team.","fixedNotes":"求职专用语料：express my keen interest in this position / my qualifications align with your requirements / I would appreciate the opportunity to attend an interview.","topics":["应聘英语助教","应聘公司行政岗位","应聘志愿者协调员"],"notes":"求职信重点是「匹配」：我的资历符合你的要求，并争取面试机会。","check":"① 格式 ② 应聘职位来源 ③ 资历匹配 ④ 争取面试","prompt":"写一封求职信：你应聘某培训机构的英语助教岗位。"},

{"id":301,"layer":3,"cat":"vocab","key":"vc-activity","name":"语料① 活动与比赛","pri":1,"fixed":"可复用表达（跨题型）：\nbroaden one's horizons 拓宽视野\nenrich campus life 丰富校园生活\ngain experience 积累经验\npromote communication 增进交流\npromote cultural exchange 促进文化交流\ndemonstrate one's abilities 展示才能\nimprove teamwork skills 提高团队合作能力\nprovide a valuable opportunity 提供宝贵机会\norganize an event 组织活动\nparticipate in an event 参加活动","howto":"直接套用：The activity is intended to broaden students' horizons and enrich campus life. / It also provides a valuable opportunity for students to demonstrate their abilities and improve teamwork skills.","topics":["英语演讲比赛的意义","校园文化节的活动描述","志愿者活动的价值"],"notes":"语料是「零件」，不是每篇都要全用。活动类作文优先搬这组。","check":"① 是否贴合题型 ② 语法正确 ③ 是否比生硬堆高级词更自然","prompt":"用这组语料写两句：描述你校即将举办的英语文化节及其意义。"},
{"id":302,"layer":3,"cat":"vocab","key":"vc-timeplace","name":"语料② 时间、地点与安排","pri":1,"fixed":"可复用表达（跨题型）：\ntake place on/at/in... 将于……举行\nThe event will take place at 9 a.m. next Friday in the university auditorium. 活动将于下周五上午 9 点在大学礼堂举行\nduring the event 活动期间\nThe arrangements are as follows. 活动安排如下\nspecific details 具体细节\nregister for... 报名参加\nregistration deadline 报名截止日期\nprepare in advance 提前准备\narrive on time 按时到达","howto":"直接套用：Please register before the deadline and arrive on time.","topics":["通知里的时间地点","邀请信的活动安排","活动类描述"],"notes":"通知和邀请信几乎必用这组，务必记牢搭配介词。","check":"① take place 后介词正确 ② 时间地点顺序 ③ 截止日期表达","prompt":"用这组语料写两句话：通知一场讲座的时间、地点、报名方式和截止日期。"},
{"id":303,"layer":3,"cat":"vocab","key":"vc-suggest","name":"语料③ 建议与解决问题","pri":1,"fixed":"可复用表达（跨题型）：\noffer suggestions 提出建议\nfocus on 重点关注\ntake effective measures 采取有效措施\naddress the problem 解决问题\nimprove the current situation 改善现状\ndevelop good habits 养成良好习惯\nmake a reasonable plan 制定合理计划\ntake ... into full consideration 充分考虑","howto":"直接套用：I strongly recommend that you make a reasonable plan and follow it consistently. / It would be beneficial to take these suggestions into consideration.","topics":["给朋友的备考建议","如何改善学习习惯","解决拖延问题"],"notes":"建议信和正面论证都常用这组。","check":"① recommend 后接动词原形 ② 建议具体可执行 ③ 语气","prompt":"用这组语料写两句建议：给你的学弟学妹如何高效备考。"},
{"id":304,"layer":3,"cat":"vocab","key":"vc-ability","name":"语料④ 个人能力与申请","pri":1,"fixed":"可复用表达（跨题型）：\nrelevant knowledge 相关知识\npractical experience 实践经验\ncommunication skills 沟通能力\norganizational skills 组织能力\nteamwork skills 团队合作能力\na strong sense of responsibility 强烈的责任感\nbe willing to learn 乐于学习\nbe qualified for the position 胜任这一职位","howto":"直接套用：I have acquired relevant knowledge and developed strong communication skills through practical experience. / I am responsible, cooperative, and willing to learn.","topics":["申请信的资历陈述","推荐信的能力描述","求职信的自我介绍"],"notes":"申请信、推荐信、求职信三类都靠这组撑内容。","check":"① 知识与经历的搭配 ② 语气 ③ 与申请目的的匹配","prompt":"用这组语料写两句：介绍你自己申请某实习岗位的优势。"},
{"id":305,"layer":3,"cat":"vocab","key":"vc-polite","name":"语料⑤ 礼貌表达与结尾","pri":1,"fixed":"可复用表达（跨题型）：\nThank you for your assistance. 感谢您的帮助\nThank you for your time and consideration. 感谢您的时间和考虑\nI hope you can understand my situation. 希望您能理解\nI look forward to your reply. 期待您的回复\nPlease feel free to contact me if you have any questions. 如有问题请联系我\nI hope these suggestions will be helpful. 希望这些建议有帮助\nThank you again for your kindness and support. 再次表示感谢","howto":"礼貌程度和语气比刻意用冷僻词更重要。这组是各类书信的「收尾零件」，按题型选两句即可。","topics":["各类书信的结尾","礼貌请求","致谢收束"],"notes":"小作文中，礼貌程度、语气和题目要求的匹配，比刻意使用冷僻词更重要。","check":"① 语气是否符合收信人身份 ② 结尾是否得体","prompt":"用这组语料给一封信写一个礼貌的结尾段（邀请信场景）。"}

var enTpls=[], enReviews=[], enNotes=[], enMetas={};
var enView='home'; // home | detail
var enCur=null;
var EN_LVL={1:'遗忘',2:'模糊',3:'有点印象',4:'能默写',5:'应用通过'};
/* ========== 英语模块 · 本地持久化层 ========== */
var EN_STORE_KEY='kb_english_store_v1';
var enStoreData=null;
function enStoreGet(){
 if(enStoreData)return enStoreData;
 try{var raw=localStorage.getItem(EN_STORE_KEY);enStoreData=raw?JSON.parse(raw):{reviews:{},notes:{},ids:{},first:{}};}
 catch(e){enStoreData={reviews:{},notes:{},ids:{},first:{}};}
 return enStoreData;
}
function enStoreSave(){try{localStorage.setItem(EN_STORE_KEY,JSON.stringify(enStoreGet()));}catch(e){}}
function enStoreAddReview(tplId,date,level,stage){
 var s=enStoreGet();
 s.reviews[tplId+'_'+date]={template_id:tplId,review_date:date,level:level,stage:stage};
 s.first[tplId]=s.first[tplId]||date;
 enStoreSave();
}
function enStoreSetNote(tplId,date,content){
 var s=enStoreGet();
 if(!content){delete s.notes[tplId];}else{s.notes[tplId]={template_id:tplId,note_date:date,content:content};}
 enStoreSave();
}
function enReviewsOf(id){
 var s=enStoreGet(),out=[];
 Object.keys(s.reviews).forEach(function(k){var r=s.reviews[k];if(r.template_id==id)out.push(r);});
 out.sort(function(a,b){return a.review_date.localeCompare(b.review_date);});

var EN_NODES=[1,2,4,7,15]; // 艾宾浩斯间隔

function enToday(){return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());}
function enDays(a,b){
 var x=new Date(a);x.setHours(0,0,0,0);
 return Math.round((new Date(b)-x)/86400000);
}
function enAddDays(s,n){var x=new Date(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function enEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enEn(id){return enTpls.filter(function(t){return t.id==id;})[0]||null;}
function enLastLevel(id){var rs=enReviewsOf(id);return rs.length?rs[rs.length-1].level:0;}
function enLastDate(id){var rs=enReviewsOf(id);return rs.length?rs[rs.length-1].review_date:null;}
function enFirstDate(id){var rs=enReviewsOf(id);return rs.length?rs[0].review_date:null;}
function enIsDue(id){
 var rs=enReviewsOf(id);
 if(!rs.length)return true; // 未首背，优先派
 var d=enLastDate(id);
 var days=enDays(d,enToday());
 if(days<0)return false;
 if(days===0)return true;
 var lvl=enLastLevel(id);
 return days >= (lvl>=4?7:enGapAfter(d,enFirstDate(id)));
}
function enGapAfter(last,first){
 var past=enDays(first,last);
 var seq=[0].concat(EN_NODES);
 for(var i=0;i<seq.length;i++){if(seq[i]===past)return (seq[i+1]!==undefined?seq[i+1]-past:15);}
 return 15;
}

function enPickToday(){
 var cand=EN_DATA.slice().sort(function(a,b){return a.order-b.order;});
 var due=[], fresh=[];
 cand.forEach(function(d){
  var t=enEn(d.id);
  if(!enFirstDate(d.id)){due.push(d);return;}
  if(enIsDue(d.id))due.push(d);
  else fresh.push(d);
 });
 if(due.length)return due[0];
 return fresh[0]||cand[0];
}

/* =================== 小作文模块逻辑（SW）====================
   三层循环：体裁(L2) / 格式(L1骨架+通知纪要) / 语料(L3)
   推进规则：背熟才解锁（unlockDays=3，连续 3 天自评≥4 才解锁下一档）
   =========================================================== */
var swView='home';          // home | detail
var swCur=null;             // 当前条目 id
var swTab='all';            // 小作文内子页签：all / letters / skeleton / vocab
var SW_KEY='kb_sw_reviews'; // 自评记录表
var SW_NOTE_KEY='kb_sw_notes';
var SW_PROG_KEY='kb_sw_progress'; // 体裁档位进度
var SW_UNLOCK=3;            // 连续几天自评≥4 才解锁下一档
var swReviews=[];
var swNotes=[];

function swEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function swToday(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function swAddDays(s,n){var x=new Date(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function swStoreGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function swStoreSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// 体裁档位进度：记录每个 L2 体裁"已连续自评≥4 的天数"
var swProgress={}; // { [cat]: {day:天数, date:最近自评日期} }

// 取某条记录数组
function swRevOf(id){return swReviews.filter(function(r){return (r.template_id||r.sw_id)==id;});}
function swNoteOf(id){return swNotes.filter(function(n){return (n.template_id||n.sw_id)==id;}).sort(function(a,b){return String(b.note_date||b.date||'').localeCompare(String(a.note_date||a.date||''));});}
function swLastLevel(id){var rs=swRevOf(id);return rs.length?rs[rs.length-1].level:0;}
function swLastDate(id){var rs=swRevOf(id);return rs.length?(rs[rs.length-1].review_date||rs[rs.length-1].date||''):'';}

// 优先级分组（1→5）
function swByPriority(){var g={};SW_DATA.forEach(function(d){var p=d.pri||5;(g[p]=g[p]||[]).push(d);});return g;}
function swLayerName(l){return l==1?'L1 结构骨架':l==2?'L2 体裁模板':'L3 个人语料';}

/* 解锁逻辑：连续 unlock 天自评≥4 才解锁下一档
   显示顺序：优先推当前档（正在背的），档内按 priority 排序 */
function swCurrentCat(){
 var groups=swByPriority();
 var catOrder=['suggest','invite','recommend','inquire','apology','gratitude','apply','complaint','congrat','resign','job'];
 // 找到第一个「尚未背熟（连续天数<unlock）」的体裁
 for(var i=0;i<catOrder.length;i++){
  var cat=catOrder[i];
  var list=SW_DATA.filter(function(d){return d.layer===2&&d.cat===cat;});
  if(!list.length)continue;
  var prog=swProgress[cat]||{day:0};
  if(prog.day<SW_UNLOCK){return cat;}
 }
 return null; // 全部解锁
}
function swIsLocked(id){
 var d=SW_DATA.filter(function(x){return x.id==id;})[0];if(!d)return false;
 if(d.layer!==2)return false;
 var prog=swProgress[d.cat]||{day:0};
 return prog.day<SW_UNLOCK;
}
function swLockReason(id){
 var d=SW_DATA.filter(function(x){return x.id==id;})[0];if(!d||d.layer!==2)return '';
 var prog=swProgress[d.cat]||{day:0};
 var daysLeft=SW_UNLOCK-prog.day;
 var cur=swCurrentCat();
 if(!cur)return '全部体裁已背熟，可自由复习';
 if(cur!==d.cat)return '当前档：'+cur+'（再背 '+daysLeft+' 天即可解锁下一档）';
 return '当前档，再背 '+daysLeft+' 天解锁下一档';
}

// 今日待背：优先当前体裁档 + 一个语料条 + 骨架轮换
function swPickToday(){
 var cat=swCurrentCat();
 var today=swToday();
 var picked=[];
 // 1) 当前体裁：优先推「今天还没自评过」的那条
 var pool=SW_DATA.filter(function(d){return d.layer===2&&d.cat===cat;});
 var todo=pool.filter(function(d){return swLastDate(d.id)!==today;});
 var pick=todo.length?todo[0]:(pool[0]||null);
 if(pick)picked.push(pick);
 // 2) 语料条（L3）：每天轮换一条，按 priority 顺序循环
 var vc=SW_DATA.filter(function(d){return d.layer===3;});
 var idx=(function(){
  var total=swReviews.filter(function(r){return {}.hasOwnProperty.call(SW_DATA.reduce(function(o,d){o[d.id]=d;return o;},{}),r.template_id||r.sw_id);}).length;
  return total%vc.length;
 })(picked);
 // 用累计自评次数做偏移，保证每天稳定推进一条
 var offset=Math.floor(swReviews.length/vc.length);
 if(vc.length)picked.push(vc[(offset)%vc.length]);
 return picked;
}

function renderWriting(){
 if(swView==='detail'){renderSwDetail(swCur);return;}
 var today=swToday();
 var items=swPickToday();
 var cat=swCurrentCat();
 var h='<div class="back" onclick="back()">&#8592; 返回</div>';
 h+='<div class="sw-tabs"><div class="sw-tab on">&#9998; 小作文</div><div class="sw-tab" onclick="enView=\'home\';renderEnglish();nav(\'english\')">&#127757; 大作文</div></div>';
 h+='<div class="card en-card"><div class="card-h"><span class="ic">&#9998;</span>考研英语一 · 小作文 <span style="font-size:11.5px;color:var(--sub);font-weight:400;margin-left:2px">背熟才解锁 · 3 天一档</span></div>';
 // 当前档进度条
 var totalL2=SW_DATA.filter(function(d){return d.layer===2;}).length;
 var doneL2=Object.keys(swProgress).filter(function(k){return (swProgress[k].day||0)>=SW_UNLOCK;}).length;
 var pct=Math.round(doneL2/totalL2*100);
 h+='<div class="sw-bar"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="num">'+doneL2+' / '+totalL2+' 体裁已背熟 · '+pct+'%</div></div>';
 if(cat){
  var prog=swProgress[cat]||{day:0};
  h+='<div style="font-size:13px;color:var(--sub);margin-top:10px">当前档：<b style="color:#38bdf8">'+cat+'</b> · 已连续 '+prog.day+' / '+SW_UNLOCK+' 天达标，达标后解锁下一档</div>';
 }else{
  h+='<div style="font-size:13px;color:#4ade80;margin-top:10px">&#127881; 全部 11 种体裁已背熟，现在可自由抽练巩固</div>';
 }
 h+='</div>';

 // 今日待背清单
 h+='<div class="card"><div class="en-group-h">今日待背 <span class="g-cnt">'+today+' · 背熟才解锁</span></div>';
 if(!items.length){
  h+='<div class="sw-empty"><span class="big">&#127881;</span>全部体裁已背熟，去「体裁库」自由抽练吧</div>';
 }else{
  items.forEach(function(d){
   var l=swLastLevel(d.id);
   var st=l>=4?'s4':l>=3?'s3':l>=2?'s2':l>=1?'s1':'s0';
   var stxt=l>=4?'已背熟':l>=1?['','遗忘','模糊','有点印象','能默写'][l]:'今日待背';
   h+='<div class="en-item'+(swIsLocked(d.id)?' sw-locked':'')+'" onclick="swOpen('+d.id+')"><span class="no">L'+d.layer+'</span><div class="mid"><div class="mn">'+swEsc(d.name);
   h+=' <span class="sw-layer l'+d.layer+'">'+swLayerName(d.layer)+'</span>';
   h+=' <span class="sw-pri p'+(d.pri||5)+'">第 '+d.pri+' 优先</span></div>';
   h+='<div class="mg">'+(swLastDate(d.id)?('上次 '+swLastDate(d.id)+' · '+stxt):'尚未首背')+(swIsLocked(d.id)?' · 🔒 '+swLockReason(d.id):'')+'</div></div>';
   h+='<span class="st '+st+'">'+stxt+'</span><span class="arw">&#8594;</span></div>';
  });
 }
 h+='</div>';

 // 按优先级分组的体裁库
 var g=swByPriority();
 for(var p=1;p<=5;p++){
  if(!g[p]||!g[p].length)continue;
  var dl=g[p];
  var dDone=dl.filter(function(d){return swLastLevel(d.id)>=4;}).length;
  h+='<div class="card"><div class="sw-cat">第 '+p+' 优先 <span class="g-cnt">'+dDone+' / '+dl.length+' 已背熟</span></div>';
  dl.forEach(function(d){
   var l=swLastLevel(d.id);
   var st=l>=4?'s4':l>=3?'s3':l>=2?'s2':l>=1?'s1':'s0';
   var stxt=l>=4?'已背熟':l>=1?['','遗忘','模糊','有点印象','能默写'][l]:'未首背';
   var locked=swIsLocked(d.id);
   h+='<div class="en-item" onclick="swOpen('+d.id+')"><span class="no">'+(d.layer===1?'构':d.layer===2?(d.pri||'?'):'料')+'</span><div class="mid"><div class="mn">'+swEsc(d.name);
   if(d.layer===2){var pg=swProgress[d.cat]||{day:0};h+=' <span class="tag tm">'+pg.day+'/'+SW_UNLOCK+' 天</span>';}
   if(locked)h+=' <span class="tag td">🔒 未解锁</span>';
   h+='</div><div class="mg">'+(swLastDate(d.id)?('上次 '+swLastDate(d.id)):'尚未首背')+'</div></div>';
   h+='<span class="st '+st+'">'+stxt+'</span><span class="arw">&#8594;</span></div>';
  });
  h+='</div>';
 }
 h+='<footer>小作文 · 结构骨架 + 体裁模板 + 个人语料库，三层独立循环｜背熟才解锁下一档</footer>';
 document.getElementById('page-detail').innerHTML=h;
}

function swOpen(id){
 var d=SW_DATA.filter(function(x){return x.id==id;})[0];if(!d){nav('english/w');return;}
 swCur=id;swView='detail';nav('english/w/'+id);
}
function renderSwDetail(id){
 var d=SW_DATA.filter(function(x){return x.id==id;})[0];if(!d){nav('english/w');return;}
 var l=swLastLevel(d.id);
 var h='<div class="back" onclick="nav(&quot;english/w&quot;)">&#8592; 返回小作文</div>';
 h+='<div class="card en-card"><div class="card-h"><span class="ic">&#9998;</span>'+swEsc(d.name)+' <span style="font-size:12px;color:var(--sub);font-weight:400;margin-left:6px">'+swLayerName(d.layer)+' · 第 '+d.pri+' 优先</span></div>';
 h+='<div style="margin-bottom:12px"><span class="sw-layer l'+d.layer+'">'+swLayerName(d.layer)+'</span>';
 if(swIsLocked(d.id))h+=' <span class="tag td">🔒 '+swLockReason(d.id)+'</span>';
 if(swLastDate(d.id))h+=' <span class="tag tm">上次 '+swLastDate(d.id)+' · '+(l>=4?'已背熟':['','遗忘','模糊','有点印象','能默写'][l])+'</span>';
 else h+=' <span class="tag to">尚未首背</span>';
 h+='</div>';

 // 固定句原文
 h+='<div class="sw-fixed"><span class="lbl">固定背诵原文（严格按此记忆，按 [ ] 提示替换）</span>'+swEsc(d.fixed)+'</div>';

 // 固定背诵要点
 if(d.fixedNotes){
  h+='<div class="en-box"><span class="lbl">固定背诵句（必须记牢）</span><div style="font-size:13.5px;line-height:1.85">'+swEsc(d.fixedNotes)+'</div></div>';
 }
 // 语法提醒
 if(d.grammar){
  h+='<div class="en-box warn"><span class="lbl">&#9888; 语法提醒</span><div style="font-size:13.5px;line-height:1.7">'+swEsc(d.grammar)+'</div></div>';
 }
 // 记忆方法 / 使用说明
 if(d.howto){
  h+='<div class="sw-howto"><span class="lbl">怎么背 / 怎么用</span>'+swEsc(d.howto)+'</div>';
 }
 // 常考话题
 if(d.topics&&d.topics.length){
  h+='<div class="sw-topics"><span class="lbl">常考话题（点「应用验证」按这些练）</span><ul>'+d.topics.map(function(t){return '<li>'+swEsc(t)+'</li>';}).join('')+'</ul></div>';
 }
 // 五步自查表
 if(d.check){
  h+='<div class="en-box"><span class="lbl">写完必查 5 件事</span><div style="font-size:13.5px;line-height:1.9">'+d.check.split('｜').map(function(s){return '✓ '+swEsc(s);}).join('<br>')+'</div></div>';
 }
 // 使用注意
 if(d.notes){
  h+='<div class="en-box warn"><span class="lbl">&#9888; 使用注意（容易踩坑）</span><div style="font-size:13.5px;line-height:1.7">'+swEsc(d.notes)+'</div></div>';
 }
 // 应用验证
 h+='<div class="en-prompt"><span class="lbl">&#128203; 应用验证（把 [ ] 换成具体内容写一遍）</span><p>'+swEsc(d.prompt)+'</p></div>';

 // 自评
 h+='<div style="font-size:14px;font-weight:600;margin:0 0 10px;padding-left:10px;border-left:3px solid var(--accent)">自评（点一下即记录，连续 3 天「能默写」解锁下一档）</div>';
 h+='<div class="en-marks">';
 h+='<button class="l4" onclick="swMark('+d.id+',4)">&#9989; 能默写（应用通过）</button>';
 h+='<button class="l3" onclick="swMark('+d.id+',3)">&#128527; 有点印象</button>';
 h+='<button class="l2" onclick="swMark('+d.id+',2)">&#128561; 忘了</button>';
 h+='</div>';

 // 卡点备注
 h+='<div style="font-size:14px;font-weight:600;margin:22px 0 10px;padding-left:10px;border-left:3px solid var(--l3)">卡点备注 <span style="font-weight:400;font-size:12px;color:var(--sub)">输入后自动保存</span></div>';
 var ns=swNoteOf(d.id);
 h+='<textarea class="note-box" id="swNoteBox" placeholder="记容易写错、容易忘的表达…" oninput="swNote('+d.id+',this.value)">'+(ns[0]?(ns[0].content||ns[0].text||''):'')+'</textarea>';
 if(ns.length){
  h+='<div class="note-list">';
  ns.forEach(function(n){h+='<div class="nl-item"><span class="nl-date">'+swEsc(n.note_date||n.date||'')+'</span><span class="nl-text">'+swEsc(n.content||n.text||'')+'</span></div>';});
  h+='</div>';
 }
 h+='</div>';
 document.getElementById('page-detail').innerHTML=h;
}

var swNoteTimer=null;
function swNote(id,val){
 clearTimeout(swNoteTimer);
 var v=val.trim();var d=swToday();
 var key='note_'+id;
 swNoteTimer=setTimeout(function(){
  var ns=swNotes.filter(function(n){return (n.template_id||n.sw_id)==id;}).sort(function(a,b){return String(b.note_date||b.date||'').localeCompare(String(a.note_date||a.date||''));});
  if(ns[0]){
   ns[0].content=v;ns[0].text=v;
   if(!v)swNotes=swNotes.filter(function(n){return (n.template_id||n.sw_id)!=id;});
  }else if(v){
   swNotes.push({template_id:id,sw_id:id,note_date:d,date:d,content:v,text:v});
  }
  swSaveNotes();
  // 云端同步（失败不影响本地）
  try{
   if(!v){rest('/kb_sw_notes?template_id=eq.'+id,'DELETE');}
   else if(ns[0]){rest('/kb_sw_notes?template_id=eq.'+id,'PATCH',{content:v,text:v});}
   else{rest('/kb_sw_notes?select=*','POST',{template_id:id,sw_id:id,note_date:d,date:d,content:v,text:v});}
  }catch(e){}
 },1200);
}

function swMark(id,level){
 var d=SW_DATA.filter(function(x){return x.id==id;})[0];if(!d){toast('数据未加载完，请刷新');return;}
 var t=swToday();
 var rec={template_id:id,sw_id:id,review_date:t,date:t,level:level};
 var exist=swRevOf(id).filter(function(r){return (r.review_date||r.date)===t;});
 if(exist.length){
  exist[0].level=level;
 }else{
  swReviews.push(rec);
 }
 swSaveReviews();

 // 体裁档位推进：只有 L2 体裁才计入「背熟才解锁」
 if(d.layer===2){
  var prog=swProgress[d.cat]||{day:0,date:''};
  if(level>=4){
   if(prog.date!==t){ // 同一天重复自评不重复计数
    prog.day=(prog.date&&swAddDays(prog.date,1)===t)?prog.day+1:1;
    prog.date=t;
    toast('能默写 · 连续 '+prog.day+' / '+SW_UNLOCK+' 天达标');
   }else{
    toast('已记录今天的自评（同一天不重复计数）');
   }
  }else{
   // 自评<4 视为未达标，连续天数清零，明天重新累计
   prog.day=0;prog.date=t;
   toast('今天未达标，明天继续，别气馁');
  }
  swProgress[d.cat]=prog;
  swSaveProgress();
 }else{
  toast(level>=4?'已掌握 · 7 天后抽查':'已记录，继续巩固');
 }
 try{renderWriting();if(swView==='detail')renderSwDetail(id);}catch(e){}
}
</script>
