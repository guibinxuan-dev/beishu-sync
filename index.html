<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>背书地图</title>
<style>
:root{--bg:#08090c;--card:rgba(20,23,30,.6);--card-solid:#13161c;--ink:#eaecf2;--sub:#858d9c;--line:rgba(255,255,255,.07);--brand:#7c9bff;--brand2:#b07cff;--accent:#3fd6ab;--shadow:0 10px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;background:radial-gradient(1000px 600px at 8% -10%,rgba(124,155,255,.16),transparent 62%),radial-gradient(900px 700px at 92% 4%,rgba(176,124,255,.13),transparent 62%),radial-gradient(800px 600px at 50% 108%,rgba(63,214,171,.09),transparent 62%),#08090c;background-attachment:fixed}
body.light{--bg:#f4f6fa;--card:rgba(255,255,255,.78);--card-solid:#fff;--ink:#14181f;--sub:#6b7280;--line:rgba(20,24,31,.07);--shadow:0 10px 34px rgba(20,24,31,.07)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:600;font-size:14px;padding:11px 20px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transition:.18s;box-shadow:0 5px 18px rgba(124,155,255,.3)}
button:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(124,155,255,.42)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.05);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
body.light button.ghost{background:#fff}
button.ghost:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
button.soft{background:rgba(255,255,255,.04);color:var(--sub);box-shadow:none;border:1px solid var(--line)}
button.danger{background:rgba(248,113,113,.12);color:var(--l2);box-shadow:none;border:1px solid rgba(248,113,113,.25)}
button.sm{padding:6px 13px;font-size:12.5px;border-radius:10px;flex-shrink:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 100px}
.hero{position:relative;margin:22px 0 26px;border-radius:32px;padding:38px 38px 32px;overflow:hidden;background:linear-gradient(135deg,rgba(124,155,255,.15),rgba(176,124,255,.11) 48%,rgba(63,214,171,.09)),var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);letter-spacing:1.2px;text-transform:uppercase}
.hero-top .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-motto{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);opacity:.86;letter-spacing:.6px;margin-bottom:8px;font-weight:500}
.hero-motto .m-ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;background:linear-gradient(135deg,var(--l5),var(--brand));color:#fff;flex:0 0 auto;box-shadow:0 3px 10px rgba(63,214,171,.3)}
.hero-num{font-size:min(88px,16vw);font-weight:800;letter-spacing:-3.5px;line-height:1.04;margin:14px 0 4px;background:linear-gradient(120deg,#fff 8%,#c8d6ff 46%,#e6d4ff 86%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.light .hero-num{background:linear-gradient(120deg,#14181f,#3b4a7a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:14.5px;color:var(--sub);margin-bottom:4px}
.hero-quote{margin-top:6px;font-size:15.5px;color:var(--ink);letter-spacing:.2px;min-height:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-quote .q{opacity:.5;font-size:13px;color:var(--sub);font-style:normal}
.hero-row{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
.hero-cell{flex:1;min-width:104px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:.2s;cursor:pointer}
.hero-cell:hover{background:rgba(255,255,255,.075);transform:translateY(-2px)}
body.light .hero-cell:hover{background:rgba(0,0,0,.035)}
.hero-cell b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero-cell span{font-size:10.5px;color:var(--sub);letter-spacing:.8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;box-shadow:var(--shadow);transition:.25s;cursor:pointer}
.stat:hover{transform:translateY(-3px);border-color:rgba(124,155,255,.3);background:rgba(124,155,255,.06)}
body.light .stat:hover{background:rgba(124,155,255,.04)}
.stat b{display:block;font-size:30px;font-weight:800;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.stat span{font-size:11px;color:var(--sub);letter-spacing:.8px;margin-top:5px;display:block}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:700;margin-bottom:18px}
.card-h .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(124,155,255,.3)}
.ch-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.due-item{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;flex-wrap:wrap;font-size:14px;transition:.2s}
body.light .due-item{background:rgba(0,0,0,.012)}
.due-item:hover{border-color:rgba(124,155,255,.28);background:rgba(255,255,255,.06)}
.due-item.done{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.055)}
.due-item.done .nm{text-decoration:line-through;color:var(--sub)}
.due-item .nm{flex:1;min-width:140px;font-weight:600;font-size:14.5px}
.due-item .meta{font-size:11.5px;color:var(--sub);width:100%;margin-top:3px}
.due-item .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;transition:.18s;margin-top:2px;font-size:14px;color:transparent}
.due-item .ck:hover{border-color:var(--brand)}
.due-item.done .ck{background:var(--l5);border-color:var(--l5);color:#fff}
.note-box{width:100%;margin-top:12px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font-size:13px;background:rgba(255,255,255,.035);color:var(--ink);font-family:inherit;resize:vertical;min-height:38px;display:block}
body.light .note-box{background:rgba(0,0,0,.012)}
.note-box:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.14)}
.note-box::placeholder{color:var(--sub);font-size:12.5px}
.note-tag{display:inline-block;font-size:10.5px;color:var(--l3);margin-top:8px;font-weight:600}
.progress-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.progress-bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
body.light .progress-bar{background:rgba(0,0,0,.06)}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--l5),var(--brand));border-radius:8px;transition:width .4s ease}
.progress-txt{font-size:12.5px;color:var(--sub);white-space:nowrap}
.progress-txt b{color:var(--l5);font-size:15px}
.lvl-btns{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.lvl-btns button{width:34px;height:32px;padding:0;font-size:12px;border-radius:9px;color:#fff;border:2px solid transparent;box-shadow:none;transition:.15s;flex-shrink:0}
.lvl-btns button:hover{transform:scale(1.14)}
.lvl-btns button.l1{background:#c084fc}.lvl-btns button.l2{background:#f87171}.lvl-btns button.l3{background:#e0a82e}.lvl-btns button.l4{background:#22c55e}.lvl-btns button.l5{background:#e0a82e}
.empty{padding:28px;text-align:center;color:var(--sub);font-size:13.5px}
.over{color:var(--l2)!important;font-weight:600}
.soon{color:var(--l3)!important;font-weight:600}
.heat-scroll{overflow-x:auto;padding:4px 0 8px}
.heat-month{display:flex;gap:5px;margin-bottom:6px;padding-left:40px;font-size:10.5px;color:var(--sub);letter-spacing:.5px}
.heat-month span{flex:1;text-align:center}
.heat-grid{display:flex;gap:5px}
.heat-col{display:flex;flex-direction:column;gap:5px}
.heat-cell{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.055);cursor:pointer;transition:.16s;position:relative}
body.light .heat-cell{background:rgba(0,0,0,.045)}
.heat-cell:hover{transform:scale(1.55);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.heat-cell[data-l="1"]{background:#c084fc}.heat-cell[data-l="2"]{background:#f87171}.heat-cell[data-l="3"]{background:#e0a82e}.heat-cell[data-l="4"]{background:#22c55e}.heat-cell[data-l="5"]{background:#e0a82e}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin:0 2px}
.heat-tip{position:fixed;z-index:99;background:#0b0d12;color:#fff;padding:7px 12px;border-radius:10px;font-size:11.5px;pointer-events:none;opacity:0;transition:.12s;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1)}
.heat-tip.on{opacity:1}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cat-card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-4px);border-color:rgba(124,155,255,.35);box-shadow:0 14px 36px rgba(0,0,0,.35)}
body.light .cat-card:hover{box-shadow:0 14px 36px rgba(20,24,31,.1)}
.cat-card .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin:14px 0 8px;overflow:hidden}
body.light .cat-card .bar{background:rgba(0,0,0,.06)}
.cat-card .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.cat-card h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.cat-card .cnt{font-size:12.5px;color:var(--sub)}
.cat-card .arrow{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:20px;transition:.2s}
.cat-card:hover .arrow{color:var(--brand);transform:translateY(-50%) translateX(4px)}
.point{display:flex;align-items:flex-start;gap:12px;padding:14px 6px;border-bottom:1px dashed var(--line);transition:.18s;border-radius:10px}
.point:hover{background:rgba(255,255,255,.025);padding-left:12px}
body.light .point:hover{background:rgba(0,0,0,.012)}
.point:last-child{border-bottom:none}
.point .lvl{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.09);flex:0 0 auto;margin-top:7px;transition:.2s}
body.light .point .lvl{background:rgba(0,0,0,.09)}
.point .lvl[data-l="1"]{background:#c084fc;box-shadow:0 0 10px rgba(192,132,252,.5)}
.point .lvl[data-l="2"]{background:#f87171;box-shadow:0 0 10px rgba(248,113,113,.45)}
.point .lvl[data-l="3"]{background:#e0a82e;box-shadow:0 0 10px rgba(224,168,46,.4)}
.point .lvl[data-l="4"]{background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.45)}
.point .lvl[data-l="5"]{background:#e0a82e;box-shadow:0 0 10px rgba(224,168,46,.4)}
.point .info{flex:1;min-width:0;cursor:pointer}
.point .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.point .prev{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7;display:none;padding:12px 14px;background:rgba(255,255,255,.03);border-radius:11px;border:1px solid var(--line)}
body.light .point .prev{background:rgba(0,0,0,.015)}
.point.expanded .prev{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.point .acts{display:flex;gap:6px;flex-shrink:0;min-width:max-content}
.point.sel{background:rgba(124,155,255,.09);padding-left:12px;border-radius:10px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.4px}
.tm{background:rgba(34,197,94,.16);color:#4ade80}.ts{background:rgba(59,130,246,.18);color:#7aa7ff}.td{background:rgba(224,168,46,.18);color:#f0c068}.to{background:rgba(192,132,252,.18);color:#d4adff}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 20px;font-size:13.5px;font-weight:600;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--sub);cursor:pointer;transition:.18s}
.tab:hover{background:rgba(255,255,255,.08)}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 5px 16px rgba(124,155,255,.32)}
.map-grid{display:grid;gap:5px}
.map-cell{height:17px;border-radius:5px;background:rgba(255,255,255,.055);cursor:pointer;transition:.16s;position:relative}
body.light .map-cell{background:rgba(0,0,0,.045)}
.map-cell:hover{transform:scale(1.5);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.map-cell[data-note="1"]{outline:2px solid var(--l3)}
.rich{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
body.light .rich{background:rgba(0,0,0,.015)}
.rich .tb{display:flex;gap:5px;padding:8px 10px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line);flex-wrap:wrap}
body.light .rich .tb{background:rgba(0,0,0,.02)}
.rich .tb button{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);padding:4px 11px;font-size:12px;border-radius:8px;box-shadow:none}
body.light .rich .tb button{background:#fff}
.rich .tb button:hover{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;transform:none}
.rich [contenteditable]{min-height:190px;padding:15px 17px;font-size:14.5px;outline:none;line-height:1.85}
.rich [contenteditable]:empty:before{content:attr(data-ph);color:var(--sub);font-size:13.5px}
.mask{position:fixed;inset:0;background:rgba(4,5,8,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card-solid);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:26px;width:100%;max-width:660px;box-shadow:0 28px 80px rgba(0,0,0,.55)}
.modal h3{font-size:19px;margin-bottom:18px;font-weight:800}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;letter-spacing:.8px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit}
body.light .field input,body.light .field select,body.light .field textarea{background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.15)}
.field textarea{min-height:80px;resize:vertical;line-height:1.7}
.modal-acts{display:flex;gap:12px;margin-top:10px}
.modal-acts button{flex:1}
.batchbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(124,155,255,.14),rgba(176,124,255,.1));border:1px solid rgba(124,155,255,.3);border-radius:14px;padding:12px 16px;margin-bottom:16px;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}
.batchbar.on{display:flex}
.batchbar .cnt{font-size:13px;color:var(--ink);font-weight:600}
.batchbar select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:13px}
body.light .batchbar select{background:#fff}
body.light .batchbar{background:rgba(124,155,255,.06)}
.chk-wrap{display:none;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 auto;margin-top:2px}
.batch .chk-wrap{display:flex}
.batch .ck-hide{display:none!important}
.chk-wrap input{width:18px;height:18px;cursor:pointer;accent-color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--brand);cursor:pointer;margin-bottom:18px;font-weight:600}
.back:hover{color:var(--brand2)}
.topbar{position:sticky;top:0;z-index:40;padding:14px 0;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(8,9,12,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
body.light .topbar{background:rgba(244,246,250,.85)}
.topbar .logo{font-weight:800;font-size:16.5px;margin-right:auto;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.topbar input{flex:1;min-width:160px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;margin:0;transition:.18s}
body.light .topbar input{background:#fff}
.topbar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,155,255,.14)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#0b0d12;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;box-shadow:0 14px 36px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);opacity:0;transition:.26s;z-index:120}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page{display:none}
.page.on{display:block;animation:pg .3s ease}
@keyframes pg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.note-list{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.note-list .nl-item{display:flex;gap:10px;padding:9px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.05)}
body.light .note-list .nl-item{border-bottom-color:rgba(0,0,0,.05)}
.note-list .nl-date{font-family:monospace;font-size:12px;color:var(--sub);min-width:92px;flex-shrink:0}
.note-list .nl-text{flex:1;color:var(--ink);line-height:1.65}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px dashed var(--line);transition:.18s;border-radius:10px}
.list-item:hover{background:rgba(255,255,255,.025);padding-left:12px}
body.light .list-item:hover{background:rgba(0,0,0,.012)}
.list-item:last-child{border-bottom:none}
.list-item .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:28px 0;letter-spacing:.6px}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:26px 22px 24px}.hero-num{font-size:56px}.card{padding:20px 18px}.topbar input{min-width:120px}.cat-grid{grid-template-columns:1fr}.lvl-btns button{width:30px;height:30px;font-size:11px}.point .acts{flex-wrap:wrap;width:100%;margin-top:6px;justify-content:flex-end}}

/* ========== 每日英语模块 ========== */
.en-card{background:linear-gradient(135deg,rgba(63,214,171,.10),rgba(124,155,255,.07) 55%,rgba(176,124,255,.07)),var(--card);}
.en-card .card-h .ic{background:linear-gradient(135deg,#3fd6ab,#7c9bff);box-shadow:0 4px 12px rgba(63,214,171,.3)}
.en-mini{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.en-mini .en-body{flex:1;min-width:220px}

body.light .en-item .st.s0{background:rgba(0,0,0,.06)}
.en-item .st.s1{background:rgba(192,132,252,.18);color:#d4adff}
.en-item .st.s2{background:rgba(248,113,113,.18);color:#fca5a5}

function dayHash(d){
 var s=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
 var h=2166136261;h=h^s;h=Math.imul(h,16777619);h=h^(h>>>13);h=Math.imul(h,1277);h=h^(h>>>16);
 return Math.abs(h);
}
function todayQuote(){return QUOTES[dayHash(today)%QUOTES.length];}
function ts(){return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'&quot;');}

function daysBetween(a,b){var x=new Date(a);x.setHours(0,0,0,0);return Math.round((new Date(b)-x)/86400000);}
function addDaysStr(s,n){var x=new Date(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function rest(path,method,body){
 var hd={'Content-Type':'application/json','apikey':APIKEY,'Authorization':'Bearer '+APIKEY};
 var init={method:method||'GET',headers:hd};
 if(body!==undefined)init.body=JSON.stringify(body);
 return fetch(SUPABASE_URL+'/rest/v1'+path,init).then(function(r){
  if(!r.ok){return r.text().then(function(t){throw new Error(t||('HTTP '+r.status));});}
  if(r.status===204)return null;
  var ct=r.headers.get('content-type')||'';return ct.indexOf('json')>-1?r.json():null;
 });
}
function chOf(id){return chapters.filter(function(c){return c.id==id;})[0]||null;}
function pointReviews(id){return reviews.filter(function(r){return r.point_id==id;}).sort(function(a,b){return a.review_date.localeCompare(b.review_date);});}

function lastLevel(id){var rs=pointReviews(id);return rs.length?rs[rs.length-1].level:0;}
function firstDate(id){var rs=pointReviews(id);return rs.length?rs[0].review_date:null;}
function metaOf(id){return metas[id]||null;}
function lastMasterDate(id){var m=metaOf(id);if(m&&m.last_mastered)return m.last_mastered;return firstDate(id);}
function fadeDays(id){var d=lastMasterDate(id);if(!d)return -1;return daysBetween(d,ts());}
function fadeColor(id){
 var l=lastLevel(id);
 var d=lastMasterDate(id);
 if(!d)return null;
 var days=daysBetween(d,ts());
 var fresh=l>=4?1:0.45;
 var t=Math.max(0,Math.min(1,fresh-days/15));
 var stops=[[34,197,94],[163,211,74],[224,168,46],[245,158,77],[248,113,113]];
 var seg=t*4;var i=Math.min(3,Math.floor(seg));var f=seg-i;
 var c=stops[i],n=stops[i+1];
 var r=Math.round(c[0]+(n[0]-c[0])*f),g=Math.round(c[1]+(n[1]-c[1])*f),b=Math.round(c[2]+(n[2]-c[2])*f);
 return 'rgb('+r+','+g+','+b+')';
}
function isDue(id){
 var rs=pointReviews(id);
 if(!rs.length)return false;
 var todayS=ts();
 var first=rs[0].review_date;
 var day=daysBetween(first,todayS);
 if(day<0)return false;
 if(day===0)return true;
 var done={};rs.forEach(function(r){done[r.review_date]=r.level;});
 var dates=Object.keys(done).sort();
 var lastDate=dates[dates.length-1];
 var lvl=done[lastDate]||4;
 var planNext=addDaysStr(lastDate, lvl>=4?15:gapAfter(lastDate,first));
 return todayS>=planNext;
}
function gapAfter(lastDate,first){
 var past=daysBetween(first,lastDate);
 var seq=[0].concat(NODES);
 for(var i=0;i<seq.length;i++){if(seq[i]===past)return (seq[i+1]!==undefined?seq[i+1]-past:15);}
 return 15;
}

 });
 out.sort(function(a,b){return (a.first||'').localeCompare(b.first||'');});
 return out;
}

function onNote(id,val){
 clearTimeout(noteTimers[id]);
 var v=val.trim();
 noteTimers[id]=setTimeout(function(){
  var nd=pointNotes(id)[0];
  if(nd){
   if(!v){rest('/kb_notes?id=eq.'+nd.id,'DELETE').then(function(){notes=notes.filter(function(x){return x.id!=nd.id;});});return;}
   rest('/kb_notes?id=eq.'+nd.id,'PATCH',{content:v}).then(function(){nd.content=v;});
  }else if(v){
   rest('/kb_notes?select=*','POST',{point_id:id,review_id:null,note_date:ts(),content:v}).then(function(r){if(r&&r[0])notes.unshift(r[0]);});
  }
 },1200);

 var ml=[];var lastM=-1;

 }else{

function quickReview(pointId,level){
 var t=ts();
 var exist=reviews.filter(function(r){return r.point_id==pointId&&r.review_date===t;})[0];
 var after=function(){
  if(level>=4)upsertMeta(pointId,t,level);
  toast('已记录 '+LVL[level]);
  var hash=location.hash.replace(/^#/,'');
  var parts=hash.split('/');
  if(parts[0]==='chapter')renderChapter(parts[1]);
  else if(parts[0]==='detail')renderDetail(parts[1]);
  else if(parts[0]==='day')renderDay(parts[1]);
  else if(parts[0]==='stat')renderStat(parts[1]);
  else renderHome();
 };
 if(exist){
  rest('/kb_reviews?id=eq.'+exist.id,'PATCH',{level:level}).then(function(){exist.level=level;after();});
 }else{
  rest('/kb_reviews?select=*','POST',{point_id:pointId,review_date:t,level:level}).then(function(r){
   if(r&&r[0])reviews.unshift(r[0]);else reviews.push({point_id:pointId,review_date:t,level:level});
   after();
  }).catch(function(){toast('记录失败');});
 }
}

var enTpls=[], enReviews=[], enNotes=[], enMetas={};
var enView='home'; // home | detail
var enCur=null;
var EN_LVL={1:'遗忘',2:'模糊',3:'有点印象',4:'能默写',5:'应用通过'};
var EN_NODES=[1,2,4,7,15]; // 艾宾浩斯间隔

function enToday(){return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());}
function enDays(a,b){
 var x=new Date(a);x.setHours(0,0,0,0);
 return Math.round((new Date(b)-x)/86400000);
}
function enAddDays(s,n){var x=new Date(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function enEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enEn(id){return enTpls.filter(function(t){return t.id==id;})[0]||null;}
function enReviewsOf(id){return enReviews.filter(function(r){return r.template_id==id;}).sort(function(a,b){return a.review_date.localeCompare(b.review_date);});}
function enLastLevel(id){var rs=enReviewsOf(id);return rs.length?rs[rs.length-1].level:0;}
function enLastDate(id){var rs=enReviewsOf(id);return rs.length?rs[rs.length-1].review_date:null;}
function enFirstDate(id){var rs=enReviewsOf(id);return rs.length?rs[0].review_date:null;}
function enIsDue(id){
 var rs=enReviewsOf(id);
 if(!rs.length)return true; // 未首背，优先派
 var d=enLastDate(id);
 var days=enDays(d,enToday());
 if(days<0)return false;
 if(days===0)return true;
 var lvl=enLastLevel(id);
 return days >= (lvl>=4?7:enGapAfter(d,enFirstDate(id)));
}
function enGapAfter(last,first){
 var past=enDays(first,last);
 var seq=[0].concat(EN_NODES);
 for(var i=0;i<seq.length;i++){if(seq[i]===past)return (seq[i+1]!==undefined?seq[i+1]-past:15);}
 return 15;
}
// 排期：按 order 顺序，跳过已背熟且未到复习日的
function enPickToday(){
 var cand=EN_DATA.slice().sort(function(a,b){return a.order-b.order;});
 var due=[], fresh=[];
 cand.forEach(function(d){
  var t=enEn(d.id);
  if(!enFirstDate(d.id)){due.push(d);return;}
  if(enIsDue(d.id))due.push(d);
  else fresh.push(d);
 });
 if(due.length)return due[0];
 return fresh[0]||cand[0];
}
// 数据源：优先用内联 EN_DATA（离线可用），数据库仅作备份同步
function enSeed(){
 enInitFromLocal();
 // 尝试同步到数据库（失败不影响本地使用）
 rest('/kb_english_templates?select=id&limit=1').then(function(exist){
  if(exist&&exist.length){
   enSyncFromRemote();
  }else{
   // 远程为空，把本地数据推上去（仅当确实为空时）
   enPushLocal();
  }
 }).catch(function(){enRenderHomeCard();});
}

function enInitFromLocal(){
 enTpls=EN_DATA.map(function(d,i){return {
  id:'local_'+d.order,
  group_key:d.group, group_order:d.order, item_key:d.key,
  name:d.name, content:d.content, cn_prompt:d.prompt,
  notes:(d.memory||'')+' | '+(d.notes||''), sort_order:d.order
 };});
 // 把生成的 id 回写到 EN_DATA，供 enMark/enOpen 等按 id 使用
 EN_DATA.forEach(function(d,i){d.id='local_'+d.order;});
 enRenderHomeCard();
}

function enSyncFromRemote(){
 rest('/kb_english_templates?select=*&order=group_order').then(function(t){
  if(t&&t.length){
   enTpls=t;
   // 用远程 id 回写
   EN_DATA.forEach(function(d){
    var tm=t.filter(function(x){return x.item_key===d.key;})[0];
    if(tm)d.id=tm.id;
   });
  }
  return rest('/kb_english_reviews?select=*&order=review_date.desc');
 }).then(function(r){
  if(r)enReviews=r;
  return rest('/kb_english_notes?select=*&order=note_date.desc');
 }).then(function(n){
  if(n)enNotes=n;
  return rest('/kb_meta?select=*');
 }).then(function(m){
  enMetas={};(m||[]).forEach(function(x){enMetas[x.point_id||x.template_id]=x;});
  enRenderHomeCard();
 }).catch(function(){enRenderHomeCard();});
}

function enPushLocal(){
 var chain=Promise.resolve();
 EN_DATA.forEach(function(d){
  chain=chain.then(function(){
   return rest('/kb_english_templates?select=id','POST',{
    group_key:d.group, group_order:d.order, item_key:d.key, name:d.name,
    content:d.content, cn_prompt:d.prompt, notes:(d.memory||'')+' | '+(d.notes||''), sort_order:d.order
   }).then(function(r){
    if(r&&r[0])d.id=r[0].id;
   }).catch(function(){});
  });
 });
 chain.then(function(){enRenderHomeCard();});
}
function enLoadAll(){
 // 本地内联数据兜底：远程不可用时保证页面正常
 if(!enTpls.length){enInitFromLocal();return;}
 enRenderHomeCard();
}
function enRenderHomeCard(){
 var box=document.getElementById('enCard');if(!box)return;
 var t=enPickToday();
 if(!t){box.innerHTML='<div class="empty">英语语料已全部加载</div>';return;}
 var l=enLastLevel(t.id);
 var html='<div class="en-mini">';
 html+='<div class="en-body"><div class="en-name">'+enEsc(t.name)+' <span class="tag ts">'+enEsc(t.group)+'</span></div>';
 html+='<div class="en-meta">第 '+t.order+' / '+EN_DATA.length+' 片 · ';
 if(!enFirstDate(t.id))html+='<b style="color:#3fd6ab">今日首背</b>';
 else html+='上次 '+enLastDate(t.id)+' · '+EN_LVL[l];
 html+=' · 距下次复习 '+enDays(enLastDate(t.id)||enToday(),enAddDays(enToday(),(l>=4?7:1)))+' 天</div></div>';
 html+='<div class="en-act"><button onclick="enOpen('+t.id+')">开始今日 1 片</button></div>';
 html+='</div>';
 html+='<div class="en-marks"><button class="ghost sm" onclick="nav(&quot;english&quot;)">进入模块</button>';
 html+='<span style="font-size:11.5px;color:var(--sub);margin-left:auto" id="enMarkTxt"></span></div>';
 box.innerHTML=html;
 var done=EN_DATA.filter(function(d){return enFirstDate(d.id);}).length;
 var mastered=EN_DATA.filter(function(d){return enLastLevel(d.id)>=4;}).length;
 var txt=document.getElementById('enMarkTxt');
 if(txt)txt.textContent='已首背 '+done+'/'+EN_DATA.length+' · 已掌握 '+mastered;
}
function enOpen(id){
 enCur=id;enView='detail';nav('english/'+id);
}
function renderEnglish(){
 if(enView==='detail'){renderEnDetail(enCur);return;}
 var h='<div class="back" onclick="nav(&quot;&quot;)">&#8592; 返回首页</div>';
 h+='<div class="card en-card"><div class="card-h"><span class="ic">&#127757;</span>每日英语 <span style="font-size:11.5px;color:var(--sub);font-weight:400;margin-left:2px">每天 1 片 · 应用验证</span><div class="ch-act"><button class="ghost sm" onclick="enTodayMark()">标记今日已完成</button></div></div>';
 var t=enPickToday();
 if(t){
  var l=enLastLevel(t.id);
  h+='<div class="en-mini"><div class="en-body"><div class="en-name">今日待背：'+enEsc(t.name)+' <span class="tag ts">'+enEsc(t.group)+'</span></div>';
  h+='<div class="en-meta">第 '+t.order+' / '+EN_DATA.length+' 片';
  if(enFirstDate(t.id))h+=' · 上次 '+enLastDate(t.id)+' · '+EN_LVL[l];
  else h+=' · 尚未首背';
  h+='</div></div><div class="en-act"><button onclick="enOpen('+t.id+')">开始今日 1 片</button></div></div>';
 }
 h+='</div>';
 // 分组
 var groups={};
 EN_DATA.forEach(function(d){if(!groups[d.group])groups[d.group]=[];groups[d.group].push(d);});
 var order=['A-模板','B-语料'];
 order.forEach(function(g){
  if(!groups[g])return;
  var list=groups[g];
  var done=list.filter(function(d){return enFirstDate(d.id);}).length;
  var mastered=list.filter(function(d){return enLastLevel(d.id)>=4;}).length;
  h+='<div class="card"><div class="en-group-h">'+enEsc(g)+' <span class="g-cnt">'+done+'/'+list.length+' 已背 · '+mastered+' 已掌握</span></div>';
  list.forEach(function(d){
   var l2=enLastLevel(d.id);
   var due=enIsDue(d.id);
   var st='s0',stxt='未首背';
   if(l2){st=l2>=4?'s4':'s'+(l2<=2?'1':l2===3?'3':'2');stxt=EN_LVL[l2];}
   if(due&&enFirstDate(d.id)){st='due';stxt='待复习';}
   h+='<div class="en-item" onclick="enOpen('+d.id+')"><span class="no">'+d.order+'</span><div class="mid"><div class="mn">'+enEsc(d.name);
   if(due&&enFirstDate(d.id))h+=' <span class="tag td">待复习</span>';
   h+='</div><div class="mg">'+(enFirstDate(d.id)?('上次 '+enLastDate(d.id)):'尚未首背')+'</div></div>';
   h+='<span class="st '+st+'">'+stxt+'</span><span class="arw">&#8594;</span></div>';
  });
  h+='</div>';
 });
 h+='<footer>英语模板与语料 · 严格按艾宾浩斯 + 应用验证排期</footer>';
 document.getElementById('page-detail').innerHTML=h;
}
function renderEnDetail(id){
 var d=EN_DATA.filter(function(x){return x.id==id;})[0];if(!d){nav('english');return;}
 var l=enLastLevel(d.id);
 var h='<div class="back" onclick="nav(&quot;english&quot;)">&#8592; 返回英语模块</div>';
 h+='<div class="card en-card"><div class="card-h"><span class="ic">&#127757;</span>'+enEsc(d.name)+' <span style="font-size:12px;color:var(--sub);font-weight:400;margin-left:6px">'+enEsc(d.group)+' · 第 '+d.order+'/'+EN_DATA.length+' 片</span></div>';
 h+='<div style="margin-bottom:12px"><span class="tag '+(d.group==='A-模板'?'ts':'td')+'">'+enEsc(d.group)+'</span>';
 if(enFirstDate(d.id))h+=' <span class="tag tm">当前 '+EN_LVL[l]+'</span> <span style="font-size:12px;color:var(--sub)">上次 '+enLastDate(d.id)+'</span>';
 else h+=' <span class="tag to">尚未首背</span>';
 if(enIsDue(d.id)&&enFirstDate(d.id))h+=' <span class="tag td">今日待复习</span>';
 h+='</div>';
 h+='<div class="en-box"><span class="lbl">模板 / 语料原文</span><div style="font-size:14px;line-height:1.9;white-space:pre-wrap">'+enEsc(d.content)+'</div></div>';
 if(d.table){
  h+='<div class="en-box"><span class="lbl">功能表</span><div style="font-size:13px;line-height:1.8;white-space:pre-wrap">'+enEsc(d.table)+'</div></div>';
 }
 if(d.vocab&&d.vocab.length){
  h+='<div class="en-box"><span class="lbl">语料清单</span><ul class="en-vocab">';
  d.vocab.forEach(function(v){var p=v.split(' ');h+='<li><b>'+enEsc(v)+'</b></li>';});
  h+='</ul></div>';
 }
 if(d.plug){
  h+='<div class="en-box"><span class="lbl">套用示范（可直接放进 P2 / P3）</span><div style="font-size:13.5px;line-height:1.85;white-space:pre-wrap">'+enEsc(d.plug)+'</div></div>';
 }
 if(d.memory){
  h+='<div class="en-box"><span class="lbl">记忆顺序</span><div style="font-size:13.5px;line-height:1.7">'+enEsc(d.memory)+'</div></div>';
 }
 if(d.rule){
  h+='<div class="en-box"><span class="lbl">替换 / 选择规则</span><div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">'+enEsc(d.rule)+'</div></div>';
 }
 if(d.notes){
  h+='<div class="en-box warn"><span class="lbl">&#9888; 使用注意（容易踩坑）</span><div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">'+enEsc(d.notes)+'</div></div>';
 }
 // 应用验证
 h+='<div class="en-prompt"><span class="lbl">&#128203; 应用验证</span><p>'+enEsc(d.prompt)+'</p></div>';
 h+='<div style="font-size:14px;font-weight:600;margin:0 0 10px;padding-left:10px;border-left:3px solid var(--accent)">自评（点了就记录，复习间隔自动调整）</div>';
 h+='<div class="en-marks">';
 h+='<button class="l4" onclick="enMark('+d.order+',4)">&#128077; 想起来了（应用通过）</button>';
 h+='<button class="l3" onclick="enMark('+d.order+',3)">&#128527; 有点印象</button>';
 h+='<button class="l2" onclick="enMark('+d.order+',2)">&#128561; 忘了</button>';
 h+='</div>';
 // 卡点备注
 h+='<div style="font-size:14px;font-weight:600;margin:22px 0 10px;padding-left:10px;border-left:3px solid var(--l3)">卡点备注 <span style="font-weight:400;font-size:12px;color:var(--sub)">输入后自动保存</span></div>';
 var ns=enNotes.filter(function(n){return n.template_id==d.id;}).sort(function(a,b){return b.note_date.localeCompare(a.note_date);});
 h+='<textarea class="note-box" id="enNoteBox" placeholder="这里记容易写错、容易忘的表达…" oninput="enNote('+d.id+',this.value)">'+(ns[0]?ns[0].content:'')+'</textarea>';
 if(ns.length){
  h+='<div class="note-list">';
  ns.forEach(function(n){h+='<div class="nl-item"><span class="nl-date">'+n.note_date+'</span><span class="nl-text">'+enEsc(n.content)+'</span></div>';});
  h+='</div>';
 }
 h+='</div>';
 document.getElementById('page-detail').innerHTML=h;
}
var enNoteTimer=null;
function enNote(id,val){
 clearTimeout(enNoteTimer);
 var v=val.trim();
 enNoteTimer=setTimeout(function(){
  var ns=enNotes.filter(function(n){return n.template_id==id;}).sort(function(a,b){return b.note_date.localeCompare(a.note_date);});
  if(ns[0]){
   if(!v){rest('/kb_english_notes?id=eq.'+ns[0].id,'DELETE').then(function(){enNotes=enNotes.filter(function(x){return x.id!=ns[0].id;});});return;}
   rest('/kb_english_notes?id=eq.'+ns[0].id,'PATCH',{content:v});
  }else if(v){
   rest('/kb_english_notes?select=*','POST',{template_id:id,review_id:null,note_date:enToday(),content:v}).then(function(r){if(r&&r[0])enNotes.unshift(r[0]);});
  }
 },1200);
}
function enMark(order,level){
 var d=EN_DATA.filter(function(x){return x.order==order;})[0];if(!d||!d.id){toast('数据未加载完，请刷新');return;}
 var t=enToday();
 var exist=enReviews.filter(function(r){return r.template_id==d.id&&r.review_date===t;})[0];
 var after=function(){
  toast(EN_LVL[level]+' · '+(level>=4?'7 天后抽查':'已安排近期复习'));
  enRenderHomeCard();renderEnDetail(d.id);
 };
 var stage = level>=4 ? '应用验证' : '首背';
 if(exist){
  rest('/kb_english_reviews?id=eq.'+exist.id,'PATCH',{level:level,stage:stage}).then(function(){exist.level=level;exist.stage=stage;after();});
 }else{
  rest('/kb_english_reviews?select=*','POST',{template_id:d.id,review_date:t,level:level,stage:stage}).then(function(r){
   if(r&&r[0])enReviews.unshift(r[0]);else enReviews.push({template_id:d.id,review_date:t,level:level,stage:stage});
   after();
  }).catch(function(){toast('记录失败');});
 }
}
function enTodayMark(){
 var d=enPickToday();if(!d||!d.id){toast('今天没有待背的');return;}
 enMark(d.order,4);
}
</script>
</body>
</html>
