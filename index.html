<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背书地图 · 国际商务</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
 --bg:#eef1f6;--card:#ffffff;--ink:#14181f;--sub:#737b88;--line:#e2e7ef;
 --brand:#3b5bfd;--brand2:#7b5cf0;--soft:#f4f6fb;--shadow:0 2px 12px rgba(20,24,31,.06);
 --l5:#22c55e;--l4:#3b82f6;--l3:#a16207;--l2:#ef4444;--l1:#a855f7;--lvl:#cbd5e1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
body.dark{--bg:#0d1015;--card:#161b23;--ink:#e8ebf0;--sub:#8992a0;--line:#262d38;--soft:#1b212c;--shadow:0 2px 16px rgba(0,0,0,.3);--lvl:#33404f}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;font-weight:600;font-size:13.5px;padding:9px 16px;background:var(--brand);color:#fff;transition:.15s}
button:hover{opacity:.88}
button.ghost{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
button.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 80px}

/* 倒计时条 */
.countdown{background:linear-gradient(120deg,#3b5bfd,#7b5cf0 55%,#c14bfd);color:#fff;border-radius:20px;padding:22px 24px;margin:14px 0;box-shadow:0 12px 30px rgba(59,91,253,.25);position:relative;overflow:hidden}
.countdown::after{content:'🎓';position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.22}
.countdown .cd-label{font-size:13px;opacity:.9}
.countdown .cd-num{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:2px 0}
.countdown .cd-sub{font-size:12.5px;opacity:.92}
.countdown .cd-row{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
.countdown .cd-cell{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 16px;min-width:96px}
.countdown .cd-cell b{display:block;font-size:20px}
.countdown .cd-cell span{font-size:11px;opacity:.9}

/* 待复习卡 */
.due-card{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);border-left:4px solid var(--l4)}
.due-card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.due-list{display:flex;flex-direction:column;gap:8px}
.due-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);border-radius:12px;flex-wrap:wrap;font-size:13.5px}
.due-item .pt-name{flex:1;min-width:160px;font-weight:600}
.due-item .pt-meta{font-size:11.5px;color:var(--sub)}
.lvl-btns{display:flex;gap:4px;margin-left:auto}
.lvl-btns button{width:30px;height:26px;padding:0;font-size:11.5px;border-radius:7px;color:#fff;border:2px solid transparent}
.lvl-btns button.l1{background:var(--l1)}.lvl-btns button.l2{background:var(--l2)}
.lvl-btns button.l3{background:var(--l3)}.lvl-btns button.l4{background:var(--l4)}.lvl-btns button.l5{background:var(--l5)}
.empty-due{text-align:center;padding:14px;color:var(--sub);font-size:13px}

/* 热力图 */
.heat-wrap{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);overflow-x:auto}
.heat-wrap h3{font-size:15px;margin-bottom:14px}
.heat-scroll{overflow-x:auto}
.heat-grid{display:flex;gap:4px}
.heat-col{display:flex;flex-direction:column;gap:4px}
.heat-cell{width:15px;height:15px;border-radius:4px;background:var(--lvl);cursor:pointer;transition:transform .12s,opacity .12s;position:relative}
.heat-cell:hover{transform:scale(1.45);z-index:5;opacity:.9}
.heat-cell[data-l="1"]{background:var(--l1)}.heat-cell[data-l="2"]{background:var(--l2)}
.heat-cell[data-l="3"]{background:var(--l3)}.heat-cell[data-l="4"]{background:var(--l4)}.heat-cell[data-l="5"]{background:var(--l5)}
.heat-month{display:flex;gap:4px;margin-bottom:4px;padding-left:32px;font-size:10.5px;color:var(--sub)}
.heat-month span{flex:1;text-align:center}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin:0 2px}
.heat-tooltip{position:fixed;z-index:99;background:#14181f;color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.heat-tooltip.on{opacity:1}

/* 章节面板 */
.chapter{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.chapter-top{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0}
.chapter-top .caret{width:16px;height:16px;flex:0 0 auto;color:var(--sub);transition:transform .2s}
.chapter.open .chapter-top .caret{transform:rotate(90deg)}
.chapter-top h2{font-size:16.5px;flex:1}
.chapter-top .cnt{font-size:11.5px;color:var(--sub);background:var(--soft);padding:2px 9px;border-radius:20px}
.chapter-body{display:none;padding-top:12px}
.chapter.open .chapter-body{display:block}
.point{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.point:last-child{border-bottom:none}
.point .info{flex:1;min-width:0}
.point .info .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.point .info .preview{font-size:12.5px;color:var(--sub);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tm{background:#dcfce7;color:#15803d}.ts{background:#dbeafe;color:#1d4ed8}.td{background:#fef3c7;color:#a16207}.to{background:#f3e8ff;color:#7c3aed}
body.dark .tm{background:#12351f;color:#4ade80}body.dark .ts{background:#172554;color:#93c5fd}body.dark .td{background:#3f2a06;color:#fbbf24}body.dark .to{background:#3b1f5c;color:#d8b4fe}
.lvl-dot{width:9px;height:9px;border-radius:50%;background:var(--lvl);flex:0 0 auto;margin-top:6px}
.lvl-dot[data-l="1"]{background:var(--l1)}.lvl-dot[data-l="2"]{background:var(--l2)}.lvl-dot[data-l="3"]{background:var(--l3)}
.lvl-dot[data-l="4"]{background:var(--l4)}.lvl-dot[data-l="5"]{background:var(--l5)}
.point-actions{display:flex;gap:5px;flex-shrink:0}

/* 富文本 */
.rich{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.rich .tools{display:flex;gap:4px;padding:6px 8px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rich .tools button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:3px 9px;font-size:12px;border-radius:7px}
.rich .tools button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.rich [contenteditable]{min-height:150px;padding:12px 14px;font-size:14px;outline:none;line-height:1.75}
.rich [contenteditable]:empty:before{content:attr(data-ph);color:var(--sub);font-size:13px}
.rich-view{font-size:14px;line-height:1.8;padding:2px 0}
.rich-view p{margin:6px 0}
.rich-view ul,.rich-view ol{padding-left:22px;margin:6px 0}
.rich-view h1,.rich-view h2,.rich-view h3{margin:10px 0 6px}

/* 模态 */
.mask{position:fixed;inset:0;background:rgba(10,13,18,.5);backdrop-filter:blur(2px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:620px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal h3{font-size:18px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
.modal-acts{display:flex;gap:10px;margin-top:6px}
.modal-acts button{flex:1}

/* 顶部条 */
.topbar{position:sticky;top:0;z-index:40;background:rgba(238,241,246,.92);backdrop-filter:blur(10px);padding:10px 0;margin-bottom:14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
body.dark .topbar{background:rgba(13,16,21,.92)}
.topbar .brand{font-weight:800;font-size:16px;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto}
.topbar input{flex:1;min-width:150px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--card);color:var(--ink);font-family:inherit;margin:0}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:#14181f;color:#fff;padding:11px 22px;border-radius:30px;font-size:13.5px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:0;transition:.28s;z-index:120}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:11.5px;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:12px;padding:22px 0}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.countdown .cd-num{font-size:38px}.heat-cell{width:12px;height:12px}}
</style>
</head>
<body>
<div class="wrap">

<div class="countdown">
 <div class="cd-label">🎯 距考研还有</div>
 <div class="cd-num" id="cdNum">— 天</div>
 <div class="cd-sub" id="cdSub"></div>
 <div class="cd-row">
  <div class="cd-cell"><b id="cdToday">0</b><span>今日背诵</span></div>
  <div class="cd-cell"><b id="cdMastered">0</b><span>已背熟</span></div>
  <div class="cd-cell"><b id="cdStreak">0</b><span>连续打卡</span></div>
 </div>
</div>

<div class="stats">
 <div class="stat"><b id="sPoint">0</b><span>知识点总数</span></div>
 <div class="stat"><b id="sDone">0</b><span>已首背</span></div>
 <div class="stat"><b id="sDue">0</b><span>今日待复习</span></div>
 <div class="stat"><b id="sRate">0%</b><span>背熟率</span></div>
</div>

<div class="due-card">
 <h3>📌 今日待复习 <span id="dueTag" style="font-size:11.5px;color:var(--sub);font-weight:400"></span></h3>
 <div class="due-list" id="dueList"><div class="empty-due">加载中…</div></div>
</div>

<div class="heat-wrap">
 <h3>🔥 背诵热力图 <span style="font-size:11.5px;color:var(--sub);font-weight:400">（最近 24 周，颜色取当天最高掌握等级）</span></h3>
 <div class="heat-scroll"><div class="heat-month" id="heatMonth"></div><div class="heat-grid" id="heatGrid"></div></div>
 <div class="heat-legend">
  <span>深绿＝背熟 L5</span><i style="background:var(--l5)"></i><i style="background:var(--l4)"></i><i style="background:var(--l3)"></i><i style="background:var(--l2)"></i><i style="background:var(--l1)"></i><span>浅＝遗忘 L1</span>
 </div>
</div>

<div class="topbar">
 <span class="brand">📖 背书地图</span>
 <input type="text" id="search" placeholder="🔍 搜索知识点名称或内容">
 <button class="ghost" onclick="openPointModal()">＋ 知识点</button>
 <button class="ghost" onclick="toggleDark()" id="darkBtn">🌙</button>
</div>

<div id="chapterList"></div>

<footer>数据存在 Supabase，多设备打开同一网址自动同步 · 默认密码 beishu2024</footer>
</div>

<div class="mask" id="mask">
 <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<div class="heat-tooltip" id="tip"></div>

<script>
/* ============ 配置 ============ */
var SUPABASE_URL='https://jnnsmjjhjhwrcxnklonf.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_2w2iM-cklg-Aof9dP7xB_Q_OfWQmj8V';
var ACCESS_PASSWORD='beishu2024';
var EXAM_DATE='2026-12-19';
/* 艾宾浩斯节点：首日后第 n 天提醒 */
var EB={first:0, n1:1, n2:2, n3:4, n5:7, n6:15};
var LVL_NAME={1:'遗忘',2:'模糊',3:'熟悉',4:'背熟',5:'卡壳'};
var LVL_COLOR={1:'var(--l1)',2:'var(--l2)',3:'var(--l3)',4:'var(--l4)',5:'var(--l5)'};
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

var subjects=[];   /* [{id,name,sort_order, chapters:[...]}] */
var chapters=[];   /* [{id,subject_id,name,sort_order}] */
var points=[];     /* [{id,chapter_id,name,category,content,created_at}] */
var reviews=[];    /* [{id,point_id,review_date,level,note}] */
var today=new Date();
function todayStr(){return today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'\\&#39;');}
function clean(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent||'';}
function addDays(dateStr,n){var d=new Date(dateStr);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}

/* ============ 数据层 ============ */
async function api(path,opts){opts=opts||{};var r=await fetch(SUPABASE_URL+'/rest/v1'+path,{headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},...opts});if(!r.ok){var t=await r.text();throw new Error(t||r.status);}return r.status===204?null:r.json();}

async function loadAll(){
 try{
  subjects=await api('/kb_subjects?select=*&order=sort_order');
  chapters=await api('/kb_chapters?select=*&order=sort_order');
  points=await api('/kb_points?select=*&order=created_at.desc');
  reviews=await api('/kb_reviews?select=*&order=review_date.desc');
  /* 若表是空的，初始化国际商务五章 */
  if(!subjects.length)await seedData();
  buildTree();
  render();
 }catch(e){console.error(e);toast('加载失败：'+(e.message||''));}
}

async function seedData(){
 var s=await api('/kb_subjects',{method:'POST',body:JSON.stringify({name:'国际商务',sort_order:1}),headers:{'Content-Type':'application/json','Prefer':'return=representation','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
 var sid=s[0].id;
 var chNames=['第一章 国际贸易理论','第二章 国际贸易措施','第三章 货物贸易与服务贸易','第四章 区域经济一体化与多边贸易体制','第五章 国际直接投资与跨国公司'];
 for(var i=0;i<chNames.length;i++){
  await api('/kb_chapters',{method:'POST',body:JSON.stringify({subject_id:sid,name:chNames[i],sort_order:i+1}),headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
 }
}

async function savePoint(p){
 var body=JSON.stringify({chapter_id:p.chapter_id,name:p.name,category:p.category||'简答',content:p.content||''});
 if(p.id){
  return api('/kb_points?id=eq.'+p.id,{method:'PATCH',body:body,headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
 }else{
  var r=await api('/kb_points',{method:'POST',body:body,headers:{'Content-Type':'application/json','Prefer':'return=representation','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
  return r;
 }
}
async function deletePoint(id){
 if(!confirm('删除该知识点会同时删除其全部背诵记录，确定吗？'))return;
 await api('/kb_reviews?point_id=eq.'+id,{method:'DELETE',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
 await api('/kb_points?id=eq.'+id,{method:'DELETE',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
 reviews=reviews.filter(function(r){return r.point_id!==id;});
 points=points.filter(function(p){return p.id!==id;});
 buildTree();render();toast('已删除');
}
async function saveReview(rec){
 var exist=reviews.filter(function(r){return r.point_id===rec.point_id&&r.review_date===rec.review_date;})[0];
 if(exist){
  await api('/kb_reviews?id=eq.'+exist.id,{method:'PATCH',body:JSON.stringify({level:rec.level,note:rec.note||''}),headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
  exist.level=rec.level;exist.note=rec.note||'';
 }else{
  var r=await api('/kb_reviews',{method:'POST',body:JSON.stringify(rec),headers:{'Content-Type':'application/json','Prefer':'return=representation','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}});
  reviews.unshift(r[0]);
 }
 render();
}

/* ============ 树结构 ============ */
function buildTree(){
 subjects.forEach(function(s){s.chapters=[];});
 chapters.forEach(function(c){
  var s=subjects.filter(function(x){return x.id===c.subject_id;})[0];
  if(s)c.chapters.push(c);
 });
}

/* ============ 掌握等级 ============ */
function lastLevel(pointId){var rs=reviews.filter(function(r){return r.point_id===pointId;});if(!rs.length)return 0;return rs[0].level;}
function levelOn(pointId,date){var r=reviews.filter(function(x){return x.point_id===pointId&&x.review_date===date;})[0];return r?r.level:0;}

/* 该知识点在 date 这天是否到期需要复习 */
function isDue(pointId,date){
 var rs=reviews.filter(function(r){return r.point_id===pointId;}).sort(function(a,b){return a.review_date.localeCompare(b.review_date);});
 if(!rs.length)return true;            /* 未首背，视为待背 */
 var first=rs[0].review_date;
 if(first>date)return false;
 /* 已完成的节点 */
 var done={};
 rs.forEach(function(r){done[r.review_date]=r.level;});
 var keys=Object.keys(done).sort();
 var last=keys[keys.length-1];
 /* 若今天（date）之后还有计划，不算 overdue，但这里 date 就是今天 */
 /* 规则：从 last 往后推下一个节点，若 last 之后无节点则推 1/2/4/7/15 */
 var seq=[1,2,4,7,15];
 var base=new Date(last);base.setDate(base.getDate()+1);base=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')+'-'+String(base.getDate()).padStart(2,'0');
 /* 找下一个未完成的节点 */
 var cur=last;
 var lvl=done[last];
 /* 若最近一次是 L4/L5，保持 15 天节奏；否则按序列推进 */
 var target=addDays(last, lvl>=4?15:nextNode(cur,date,keys,done));
 return date>=target;
}
function nextNode(cur,date,keys,done){
 var seq=[1,2,4,7,15];var idx=0;
 /* 简化：距首次背诵的天数 */
 var first=keys[0];var day=diffDays(first,date);
 /* 找序列中第一个 > day 的节点 */
 for(var i=0;i<seq.length;i++)if(day<seq[i])return seq[i]-day;
 return 15; /* 全部节点已过，15 天一轮 */
}
/* 今天到期清单 */
function dueList(){
 var ts=todayStr();var out=[];
 points.forEach(function(p){
  if(isDue(p.id,ts))out.push({point:p,level:lastLevel(p.id),first:firstDate(p.id)});
 });
 return out.sort(function(a,b){return (a.first||'').localeCompare(b.first||'');});
}
function firstDate(pointId){var r=reviews.filter(function(x){return x.point_id===pointId;}).sort(function(a,b){return a.review_date.localeCompare(b.review_date);})[0];return r?r.review_date:null;}

/* ============ 渲染 ============ */
function render(){
 renderCountdown();
 renderDue();
 renderHeat();
 renderStats();
 renderChapters();
}

function renderCountdown(){
 var d=diffDays(todayStr(),EXAM_DATE);
 var cd=document.getElementById('cdNum');
 if(d>0){cd.textContent=d+' 天';document.getElementById('cdSub').textContent='2026年12月19日 · 稳住，能上';}
 else if(d===0){cd.textContent='就是今天';document.getElementById('cdSub').textContent='去考吧，你已经准备好了';}
 else {cd.textContent='已开考';document.getElementById('cdSub').textContent='别看了，复盘下一站';}
 var ts=todayStr();
 document.getElementById('cdToday').textContent=reviews.filter(function(r){return r.review_date===ts;}).length;
 document.getElementById('cdMastered').textContent=points.filter(function(p){return lastLevel(p.id)>=4;}).length;
 /* 连续打卡 */
 var streak=0;var cur=ts;
 while(reviews.some(function(r){return r.review_date===cur;})){streak++;cur=addDays(cur,-1);}
 document.getElementById('cdStreak').textContent=streak;
}

function renderDue(){
 var list=dueList();
 var box=document.getElementById('dueList');
 document.getElementById('dueTag').textContent=list.length?'共 '+list.length+' 条':'今天没有';
 if(!list.length){box.innerHTML="<div class='empty-due'>🎉 今天没有待复习的条目，去背点新的吧</div>";return;}
 var h='';
 list.forEach(function(o){
  var p=o.point;
  h+="<div class='due-item' data-id='"+p.id+"'>"
   +"<span class='pt-name'>"+esc(p.name)+"</span>"
   +"<span class='pt-meta'>"+esc(chapterName(p.chapter_id))+(o.first?' · 首背 '+o.first:'')+"</span>"
   +"<span class='lvl-btns'>"
   +"<button class='l1' onclick='quickReview("+p.id+",1)'>遗</button>"
   +"<button class='l2' onclick='quickReview("+p.id+",2)'>糊</button>"
   +"<button class='l3' onclick='quickReview("+p.id+",3)'>熟</button>"
   +"<button class='l4' onclick='quickReview("+p.id+",4)'>背</button>"
   +"<button class='l5' onclick='quickReview("+p.id+",5)'>卡</button>"
   +"</span></div>";
 });
 box.innerHTML=h;
}

function renderStats(){
 var ts=todayStr();
 document.getElementById('sPoint').textContent=points.length;
 document.getElementById('sDone').textContent=points.filter(function(p){return lastLevel(p.id)>0;}).length;
 document.getElementById('sDue').textContent=dueList().length;
 var done=points.filter(function(p){return lastLevel(p.id)>0;}).length;
 var m=points.filter(function(p){return lastLevel(p.id)>=4;}).length;
 document.getElementById('sRate').textContent=done?Math.round(m/done*100)+'%':'0%';
}

function renderHeat(){
 var grid=document.getElementById('heatGrid');var mon=document.getElementById('heatMonth');
 grid.innerHTML='';mon.innerHTML='';
 var start=new Date(today);start.setDate(today.getDate()-23 * 7);start.setDate(start.getDate()-start.getDay());
 /* 计算每天的最高等级 */
 var dayMap={};
 reviews.forEach(function(r){
  var k=r.review_date;
  if(!dayMap[k]||dayMap[k]<r.level)dayMap[k]=r.level;
 });
 var weeks=[];var ml=[];var lastM=-1;
 for(var w=0;w<24;w++){
  var week=[];var d0=new Date(start);d0.setDate(start.getDate()+w*7);
  for(var dow=0;dow<7;dow++){var d=new Date(start);d.setDate(start.getDate()+w*7+dow);week.push(d);}
  weeks.push(week);
  var m=d0.getMonth();
  ml.push(m!==lastM?d0.toLocaleDateString('zh-CN',{month:'short'}):'');lastM=m;
 }
 ml.forEach(function(m){mon.innerHTML+='<span>'+m+'</span>';});
 weeks.forEach(function(week){
  var col='<div class="heat-col">';
  week.forEach(function(d){
   var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   var l=dayMap[k]||0;
   var cnt=reviews.filter(function(r){return r.review_date===k;}).length;
   col+='<div class="heat-cell'+(l?'" data-l="'+l+'"':'"')+' data-date="'+k+'" data-cnt="'+cnt+'" data-lvl="'+(l?LVL_NAME[l]:'未背')+'"></div>';
  });
  col+='</div>';grid.innerHTML+=col;
 });
 bindHeatTip();
}

function bindHeatTip(){
 var cells=document.querySelectorAll('.heat-cell');var tip=document.getElementById('tip');
 cells.forEach(function(c){
  c.addEventListener('mouseenter',function(e){
   tip.innerHTML=c.dataset.date+' · '+c.dataset.cnt+' 条 · 最高 '+c.dataset.lvl;
   tip.classList.add('on');
  });
  c.addEventListener('mousemove',function(e){tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-30+'px';});
  c.addEventListener('mouseleave',function(){tip.classList.remove('on');});
  c.addEventListener('click',function(){
   document.getElementById('search').value=c.dataset.date;doSearch(c.dataset.date);
  });
 });
}

function renderChapters(){
 var box=document.getElementById('chapterList');var h='';
 subjects.forEach(function(s){
  s.chapters.forEach(function(c){
   var cps=points.filter(function(p){return p.chapter_id===c.id;});
   var done=cps.filter(function(p){return lastLevel(p.id)>0;}).length;
   h+="<div class='chapter' id='chwrap_"+c.id+"'>"
    +"<div class='chapter-top' onclick='toggleChapter("+c.id+")'>"
    +"<svg class='caret' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><polyline points='9 18 15 12 9 6'/></svg>"
    +"<h2>"+esc(c.name)+"</h2>"
    +"<span class='cnt'>"+done+'/'+cps.length+" 已背</span>"
    +"<button class='soft sm' onclick='event.stopPropagation();openPointModal("+c.id+")'>＋</button>"
    +"</div>"
    +"<div class='chapter-body'><div class='point-list' id='plist_"+c.id+"'>";
   if(!cps.length){h+="<div style='text-align:center;padding:18px;color:var(--sub);font-size:13px'>本章还没有知识点，点右上角添加</div>";}
   cps.forEach(function(p){
    var l=lastLevel(p.id);
    h+="<div class='point'>"
     +"<span class='lvl-dot'"+(l?' data-l="'+l+'"':'')+"></span>"
     +"<div class='info'>"
     +"<div class='nm'>"+esc(p.name)+" "+tagOf(p.category)+"</div>"
     +"<div class='preview'>"+(clean(p.content)||'<span style="color:var(--sub)">还没有内容，点编辑添加</span>')+"</div>"
     +"</div>"
     +"<div class='point-actions'>"
     +"<button class='ghost sm' onclick='openPointModal(null,null,"+p.id+")'>编辑</button>"
     +"<button class='soft sm' onclick='quickReview("+p.id+",4)'>背熟</button>"
     +"<button class='soft sm' style='color:var(--l2)' onclick='deletePoint("+p.id+")'>删</button>"
     +"</div></div>";
   });
   h+="</div></div></div>";
  });
 });
 box.innerHTML=h;
}

function tagOf(c){if(c==='名词解释')return "<span class='tag tm'>名词解释</span>";if(c==='简答')return "<span class='tag ts'>简答</span>";if(c==='论述')return "<span class='tag td'>论述</span>";return "<span class='tag to'>其他</span>";}
function chapterName(id){var c=chapters.filter(function(x){return x.id===id;})[0];return c?c.name:'';}

function toggleChapter(id){
 var el=document.getElementById('chwrap_'+id);
 el.classList.toggle('open');
}

/* ============ 模态：知识点 ============ */
var curPoint=null;
function openPointModal(chapterId,forceCh,pointId){
 var modal=document.getElementById('modal');
 var p=pointId?points.filter(function(x){return x.id===pointId;})[0]:null;
 curPoint=p||null;
 var chSel='<select id="fCh">'+(p?('<option value="'+p.chapter_id+'">'+esc(chapterName(p.chapter_id))+'</option>'):'')+'</select>';
 /* 只能选已有章节 */
 var opts='';chapters.forEach(function(c){opts+='<option value="'+c.id+'"'+( (p&&p.chapter_id===c.id)||(!p&&chapterId===c.id)?' selected':'')+'>'+esc(c.name)+'</option>';});
 var html=''
  +"<h3>"+(p?'编辑知识点':'新增知识点')+"</h3>"
  +"<div class='field'><label>所属章节</label><select id='fCh'>"+opts+"</select></div>"
  +"<div class='field'><label>知识点名称</label><input id='fName' value='"+(p?esc(p.name):'')+"' placeholder='如：产品生命周期理论的内容'></div>"
  +"<div class='field'><label>题型分类</label><select id='fCat'>"
  +['名词解释','简答','论述','其他'].map(function(c){return '<option'+( (p&&p.category===c)||(!p&&c==='简答')?' selected':'')+'>'+c+'</option>';}).join('')
  +"</select></div>"
  +"<div class='field'><label>具体内容（富文本）</label><div class='rich'>"
  +"<div class='tools'>"
  +"<button onclick='fmt(\"bold\")'><b>B</b></button>"
  +"<button onclick='fmt(\"italic\")'><i>I</i></button>"
  +"<button onclick='fmt(\"underline\")'><u>U</u></button>"
  +"<button onclick='fmt(\"insertUnorderedList\")'>• 列表</button>"
  +"<button onclick='fmt(\"insertOrderedList\")'>1. 列表</button>"
  +"<button onclick='fmt(\"formatBlock\",\"h3\")'>H</button>"
  +"<button onclick='fmt(\"formatBlock\",\"p\")'>P</button>"
  +"</div>"
  +"<div id='fContent' contenteditable data-ph='在这里写知识点的具体内容，可加粗、列表…'>"+(p?p.content:'')+"</div>"
  +"</div></div>"
  +"<div class='modal-acts'>"
  +"<button class='ghost' onclick='closeModal()'>取消</button>"
  +"<button onclick='submitPoint()'>"+(p?'保存':'添加')+"</button>"
  +"</div>";
 modal.innerHTML=html;
 document.getElementById('mask').classList.add('on');
}
function fmt(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('fContent').focus();}
async function submitPoint(){
 var chapter_id=+document.getElementById('fCh').value;
 var name=document.getElementById('fName').value.trim();
 var category=document.getElementById('fCat').value;
 var content=document.getElementById('fContent').innerHTML.trim();
 if(!name){toast('请填写知识点名称');return;}
 if(curPoint){
  curPoint.chapter_id=chapter_id;curPoint.name=name;curPoint.category=category;curPoint.content=content;
  await savePoint(curPoint);
  toast('已更新');
 }else{
  await savePoint({chapter_id:chapter_id,name:name,category:category,content:content});
  toast('已添加');
 }
 /* 新增即视为首背，记录 L4 */
 if(!curPoint){
  var np=points.filter(function(p){return p.name===name&&p.chapter_id===chapter_id;})[0];
  if(np)await saveReview({point_id:np.id,review_date:todayStr(),level:4,note:'首背'});
 }
 closeModal();loadAll();
}
function closeModal(){document.getElementById('mask').classList.remove('on');curPoint=null;}

/* ============ 复习 ============ */
async function quickReview(pointId,level){
 await saveReview({point_id:pointId,review_date:todayStr(),level:level,note:''});
 toast('已记录 '+LVL_NAME[level]);
}

/* ============ 搜索 ============ */
document.getElementById('search').addEventListener('input',function(e){doSearch(e.target.value.trim());});
function doSearch(q){
 q=(q||'').toLowerCase();
 document.querySelectorAll('.chapter').forEach(function(ch){
  var hit=false;
  ch.querySelectorAll('.point').forEach(function(p){
   var txt=p.textContent.toLowerCase();
   var ok=!q||txt.indexOf(q)>-1;
   p.style.display=ok?'':'none';
   if(ok)hit=true;
  });
  var bd=ch.querySelector('.chapter-body');
  ch.classList.add('open');bd.style.display='block';
  ch.style.display=hit||!q?'':'none';
 });
}

/* ============ 暗色 ============ */
function toggleDark(){
 document.body.classList.toggle('dark');
 localStorage.setItem('kb_dark',document.body.classList.contains('dark')?'1':'0');
}
if(localStorage.getItem('kb_dark')==='1')document.body.classList.add('dark');

/* ============ 提示 ============ */
var toastTimer=null;
function toast(m){
 var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
 clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},1800);
}

/* ============ 启动 ============ */
if(localStorage.getItem('kb_logged_in')==='1'){init();}
else{
 var p=prompt('请输入访问密码（默认 beishu2024）','');
 if(p===ACCESS_PASSWORD){localStorage.setItem('kb_logged_in','1');init();}
 else{toast('密码错误');setTimeout(function(){location.reload();},600);}
}
function init(){loadAll();}
</script>
