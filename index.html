<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>背书地图</title>
<style>
:root{
 --bg:#0a0c10;--card:rgba(22,26,34,.72);--card-solid:#161a22;--ink:#e8eaf0;--sub:#8a93a3;--line:rgba(255,255,255,.08);
 --brand:#6c8cff;--brand2:#a66cff;--accent:#39d0a3;
 --glass:blur(14px);--shadow:0 8px 32px rgba(0,0,0,.35);
 --l5:#22c55e;--l4:#3b82f6;--l3:#e0a82e;--l2:#f87171;--l1:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
 color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
 background:
  radial-gradient(900px 500px at 12% -8%,rgba(108,140,255,.18),transparent 60%),
  radial-gradient(800px 600px at 88% 8%,rgba(166,108,255,.14),transparent 60%),
  radial-gradient(700px 500px at 50% 105%,rgba(57,208,163,.10),transparent 60%),
  #0a0c10;
 background-attachment:fixed;
}
body.light{--bg:#f6f7fa;--card:rgba(255,255,255,.85);--card-solid:#fff;--ink:#14181f;--sub:#6b7280;--line:rgba(20,24,31,.08);--shadow:0 8px 28px rgba(20,24,31,.08)}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:600;font-size:13.5px;padding:9px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transition:.16s;box-shadow:0 4px 14px rgba(108,140,255,.28)}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,140,255,.38)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
body.light button.ghost{background:#fff}
button.ghost:hover{background:rgba(255,255,255,.12)}
button.soft{background:rgba(255,255,255,.05);color:var(--sub);box-shadow:none;border:1px solid var(--line)}
button.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 90px}

/* 倒计时 */
.hero{position:relative;margin:16px 0 18px;border-radius:26px;padding:26px 26px 22px;overflow:hidden;
 background:linear-gradient(135deg,rgba(108,140,255,.16),rgba(166,108,255,.12) 45%,rgba(57,208,163,.10)),var(--card);
 backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);letter-spacing:.5px}
.hero-top .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hero-num{font-size:64px;font-weight:800;letter-spacing:-2.5px;line-height:1.05;margin:10px 0 2px;
 background:linear-gradient(120deg,#fff 10%,#c9d6ff 45%,#e2d0ff 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.light .hero-num{background:linear-gradient(120deg,#14181f,#3b4a7a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:13.5px;color:var(--sub)}
.hero-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-cell{flex:1;min-width:88px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
body.light .hero-cell{background:rgba(0,0,0,.02)}
.hero-cell b{display:block;font-size:19px;font-weight:800}
.hero-cell span{font-size:10.5px;color:var(--sub);letter-spacing:.4px}

/* 通用卡片 */
.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;margin-bottom:13px}
.card-h .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;
 background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;flex:0 0 auto}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;font-weight:800;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.stat span{font-size:11px;color:var(--sub);letter-spacing:.4px;margin-top:3px;display:block}

/* 待复习 */
.due-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;flex-wrap:wrap;font-size:13.5px}
body.light .due-item{background:rgba(0,0,0,.015)}
.due-item .nm{flex:1;min-width:150px;font-weight:600}
.due-item .meta{font-size:11.5px;color:var(--sub);width:100%;margin-top:2px}
.lvl-btns{display:flex;gap:5px;margin-left:auto}
.lvl-btns button{width:32px;height:28px;padding:0;font-size:11.5px;border-radius:8px;color:#fff;border:2px solid transparent;box-shadow:none}
.lvl-btns button.l1{background:var(--l1)}.lvl-btns button.l2{background:var(--l2)}
.lvl-btns button.l3{background:var(--l3)}.lvl-btns button.l4{background:var(--l4)}.lvl-btns button.l5{background:var(--l5)}
.empty{text-align:center;padding:16px;color:var(--sub);font-size:13px}
.over{color:var(--l2)!important;font-weight:600}
.soon{color:var(--l3)!important;font-weight:600}

/* 热力图 */
.heat-scroll{overflow-x:auto;padding-bottom:4px}
.heat-month{display:flex;gap:4px;margin-bottom:5px;padding-left:34px;font-size:10px;color:var(--sub)}
.heat-month span{flex:1;text-align:center}
.heat-grid{display:flex;gap:4px}
.heat-col{display:flex;flex-direction:column;gap:4px}
.heat-cell{width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.06);cursor:pointer;transition:.14s;position:relative}
body.light .heat-cell{background:rgba(0,0,0,.05)}
.heat-cell:hover{transform:scale(1.5);z-index:5}
.heat-cell[data-l="1"]{background:var(--l1)}.heat-cell[data-l="2"]{background:var(--l2)}
.heat-cell[data-l="3"]{background:var(--l3)}.heat-cell[data-l="4"]{background:var(--l4)}.heat-cell[data-l="5"]{background:var(--l5)}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);margin-top:13px;justify-content:flex-end;flex-wrap:wrap}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin:0 2px}
.heat-tip{position:fixed;z-index:99;background:#0d1015;color:#fff;padding:6px 11px;border-radius:9px;font-size:11.5px;pointer-events:none;opacity:0;transition:.12s;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.heat-tip.on{opacity:1}

/* 章节 */
.chapter{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.ch-top{display:flex;align-items:center;gap:11px;padding:16px 18px;cursor:pointer;user-select:none}
.ch-top .caret{width:15px;height:15px;flex:0 0 auto;color:var(--sub);transition:transform .22s}
.chapter.open .ch-top .caret{transform:rotate(90deg)}
.ch-top h2{font-size:15.5px;font-weight:700;flex:1}
.ch-top .cnt{font-size:11px;color:var(--sub);background:rgba(255,255,255,.07);border:1px solid var(--line);padding:2.5px 10px;border-radius:20px}
body.light .ch-top .cnt{background:rgba(0,0,0,.03)}
.ch-body{display:none;padding:0 14px 14px}
.chapter.open .ch-body{display:block}
.ch-body h4{font-size:13px;color:var(--sub);font-weight:600;margin:14px 4px 8px;padding-left:8px;border-left:3px solid var(--brand)}
.point{display:flex;align-items:flex-start;gap:11px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.point:last-child{border-bottom:none}
.point .lvl{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.09);flex:0 0 auto;margin-top:6px}
body.light .point .lvl{background:rgba(0,0,0,.09)}
.point .lvl[data-l="1"]{background:var(--l1)}.point .lvl[data-l="2"]{background:var(--l2)}
.point .lvl[data-l="3"]{background:var(--l3)}.point .lvl[data-l="4"]{background:var(--l4)}.point .lvl[data-l="5"]{background:var(--l5)}
.point .info{flex:1;min-width:0}
.point .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.point .prev{font-size:12.5px;color:var(--sub);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.6}
.point .acts{display:flex;gap:5px;flex-shrink:0}
.tag{display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.tm{background:rgba(34,197,94,.16);color:#4ade80}.ts{background:rgba(59,130,246,.18);color:#7aa7ff}
.td{background:rgba(224,168,46,.18);color:#f0c068}.to{background:rgba(192,132,252,.18);color:#d4adff}
.miss{background:rgba(248,113,113,.16);color:#f89191}

/* 富文本 */
.rich{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:rgba(255,255,255,.03)}
body.light .rich{background:rgba(0,0,0,.015)}
.rich .tb{display:flex;gap:4px;padding:7px 9px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line);flex-wrap:wrap}
body.light .rich .tb{background:rgba(0,0,0,.02)}
.rich .tb button{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);padding:3px 10px;font-size:11.5px;border-radius:7px;box-shadow:none}
body.light .rich .tb button{background:#fff}
.rich .tb button:hover{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.rich [contenteditable]{min-height:170px;padding:13px 15px;font-size:14px;outline:none;line-height:1.8}
.rich [contenteditable]:empty:before{content:attr(data-ph);color:var(--sub);font-size:13px}
.rich-view{font-size:14px;line-height:1.85}
.rich-view p{margin:7px 0}
.rich-view ul,.rich-view ol{padding-left:22px;margin:7px 0}
.rich-view h1,.rich-view h2,.rich-view h3{margin:12px 0 7px}

/* 模态 */
.mask{position:fixed;inset:0;background:rgba(5,7,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:44px 14px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card-solid);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal h3{font-size:18px;margin-bottom:16px;font-weight:800}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;letter-spacing:.4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit}
body.light .field input,body.light .field select{background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.modal-acts{display:flex;gap:10px;margin-top:8px}
.modal-acts button{flex:1}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:40;padding:12px 0;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
 background:rgba(10,12,16,.78);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--line)}
body.light .topbar{background:rgba(246,247,250,.82)}
.topbar .logo{font-weight:800;font-size:16px;margin-right:auto;background:linear-gradient(120deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.3px}
.topbar input{flex:1;min-width:150px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;margin:0}
body.light .topbar input{background:#fff}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:#0d1015;color:#fff;padding:11px 22px;border-radius:30px;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);opacity:0;transition:.26s;z-index:120}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:24px 0;letter-spacing:.4px}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.hero-num{font-size:48px}.heat-cell{width:11px;height:11px}.topbar input{min-width:110px}}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
 <div class="hero-top"><span class="dot"></span> 考研倒计时 · 每日自动更新</div>
 <div class="hero-num" id="cdNum">—</div>
 <div class="hero-sub" id="cdSub"></div>
 <div class="hero-row">
  <div class="hero-cell"><b id="cdToday">0</b><span>今日背诵</span></div>
  <div class="hero-cell"><b id="cdMastered">0</b><span>已背熟</span></div>
  <div class="hero-cell"><b id="cdDue">0</b><span>今日待复习</span></div>
  <div class="hero-cell"><b id="cdStreak">0</b><span>连续打卡</span></div>
 </div>
</div>

<div class="stats">
 <div class="stat"><b id="sPoint">0</b><span>知识点总数</span></div>
 <div class="stat"><b id="sDone">0</b><span>已首背</span></div>
 <div class="stat"><b id="sRate">0%</b><span>背熟率</span></div>
 <div class="stat"><b id="sTotal">0</b><span>累计背诵</span></div>
</div>

<div class="card">
 <div class="card-h"><span class="ic">📌</span>今日待复习 <span id="dueTag" style="font-size:11px;color:var(--sub);font-weight:400"></span></div>
 <div id="dueList"><div class="empty">加载中…</div></div>
</div>

<div class="card">
 <div class="card-h"><span class="ic">🔥</span>掌握地图 <span style="font-size:11px;color:var(--sub);font-weight:400">最近 24 周 · 颜色取当天最高掌握等级</span></div>
 <div class="heat-scroll"><div class="heat-month" id="heatMonth"></div><div class="heat-grid" id="heatGrid"></div></div>
 <div class="heat-legend">
  <span>深绿 L5背熟</span><i style="background:var(--l5)"></i><i style="background:var(--l4)"></i><i style="background:var(--l3)"></i><i style="background:var(--l2)"></i><i style="background:var(--l1)"></i><span>L1遗忘 浅</span>
 </div>
</div>

<div class="topbar">
 <span class="logo">📖 背书地图</span>
 <input type="text" id="search" placeholder="🔍 搜索知识点名称或内容">
 <button class="ghost" onclick="openPointModal()">＋ 知识点</button>
 <button class="ghost" id="darkBtn" onclick="toggleTheme()">☀️</button>
</div>

<div id="chapterList"></div>

<footer>数据存于 Supabase · 多设备打开同一网址自动同步 · 默认密码 beishu2024</footer>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="heat-tip" id="tip"></div>

<script>
/* ===== 配置 ===== */
var SUPABASE_URL='https://jnnsmjjhjhwrcxnklonf.supabase.co';
var APIKEY='sb_publishable_2w2iM-cklg-Aof9dP7xB_Q_OfWQmj8V';
var PASSWORD='beishu2024';
/* 考研日期 2026-12-19 */
var EXAM_Y=2026, EXAM_M=11, EXAM_D=19;
var LVL={1:'遗忘',2:'模糊',3:'熟悉',4:'背熟',5:'卡壳'};
var LVL_C={1:'var(--l1)',2:'var(--l2)',3:'var(--l3)',4:'var(--l4)',5:'var(--l5)'};
/* 艾宾浩斯节点（距首背天数） */
var NODES=[1,2,4,7,15];

var subjects=[], chapters=[], points=[], reviews=[];
var today=new Date(); today.setHours(0,0,0,0);
function ts(){return today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clean(s){var d=document.createElement('div');d.innerHTML=s;return d.textContent||'';}
function daysBetween(a,b){var x=new Date(a);x.setHours(0,0,0,0);return Math.round((new Date(b)-x)/86400000);}
function addDaysStr(s,n){var x=new Date(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}

/* ===== REST 封装 ===== */
function rest(path,method,body){
 var hd={'Content-Type':'application/json','apikey':APIKEY,'Authorization':'Bearer '+APIKEY};
 var init={method:method||'GET',headers:hd};
 if(body!==undefined)init.body=JSON.stringify(body);
 return fetch(SUPABASE_URL+'/rest/v1'+path,init).then(function(r){
  if(!r.ok){return r.text().then(function(t){throw new Error(t||('HTTP '+r.status));});}
  if(r.status===204)return null;
  var ct=r.headers.get('content-type')||'';return ct.indexOf('json')>-1?r.json():null;
 });
}

/* ===== 加载 ===== */
function loadAll(){
 rest('/kb_subjects?select=*&order=sort_order').then(function(s){
  subjects=s||[];return rest('/kb_chapters?select=*&order=sort_order');
 }).then(function(c){
  chapters=c||[];return rest('/kb_points?select=*&order=created_at.desc');
 }).then(function(p){
  points=p||[];return rest('/kb_reviews?select=*&order=review_date.desc');
 }).then(function(r){
  reviews=r||[];
  if(!subjects.length)return seed().then(loadAll);
  render();
 }).catch(function(e){console.error(e);toast('加载失败：'+(e.message||''));});
}

/* 初始化：国际商务 + 五章 */
function seed(){
 return rest('/kb_subjects','POST',{name:'国际商务',sort_order:1},{}).then(function(s){
  /* 标准 REST 用 return=representation 拿回 id */
  var sid=s&&s[0]&&s[0].id;
  if(!sid)throw new Error('创建科目失败');
  var names=['第一章 国际贸易理论','第二章 国际贸易措施','第三章 货物贸易与服务贸易','第四章 区域经济一体化与多边贸易体制','第五章 国际直接投资与跨国公司'];
  var chain=Promise.resolve();
  names.forEach(function(n,i){chain=chain.then(function(){return rest('/kb_chapters','POST',{subject_id:sid,name:n,sort_order:i+1});});});
  return chain;
 });
}

/* ===== 树 ===== */
function tree(){
 var map={};subjects.forEach(function(s){map[s.id]={s:s,chapters:[]};});
 chapters.forEach(function(c){var t=map[c.subject_id];if(t)t.chapters.push(c);});
 return Object.values(map).sort(function(a,b){return a.s.chapters.length?0:0;});
}

/* ===== 复习逻辑 ===== */
function pointReviews(id){return reviews.filter(function(r){return r.point_id===id;}).sort(function(a,b){return a.review_date.localeCompare(b.review_date);});}
function lastLevel(id){var rs=pointReviews(id);return rs.length?rs[rs.length-1].level:0;}
function firstDate(id){var rs=pointReviews(id);return rs.length?rs[0].review_date:null;}
/* 该点今天是否到期 */
function isDue(id){
 var rs=pointReviews(id);
 if(!rs.length)return true;
 var first=rs[0].review_date;
 var todayS=ts();
 /* 遍历到今天，判断今天是否落在某个节点日 */
 var d=0;
 var cur=first;
 /* 逐节点推进，找第一个未达的 */
 var i=0;
 /* 从首背日算，今天是第几天 */
 var day=daysBetween(first,todayS);
 if(day<0)return false;
 if(day===0)return true; /* 首背日当天 */
 /* 节点序列：0(首背),1,2,4,7,15,15,... */
 var seq=[0].concat(NODES);
 var j=1;
 /* 已完成的节点：每个 review_date 即一个已完成节点 */
 var done={};rs.forEach(function(r){done[r.review_date]=r.level;});
 var dates=Object.keys(done).sort();
 /* 从首背起，今天距首背 day 天。找序列中最大且 <= day 的节点，下一节点即目标 */
 var lastNode=0;
 for(var k=0;k<seq.length;k++){if(seq[k]<=day)lastNode=seq[k];else break;}
 var nextNode=seq[k]!==undefined?seq[k]:(lastNode+15);
 /* 如果今天已经是某个已记录节点，且下次节点还没到 */
 var nextDate=addDaysStr(first,nextNode);
 /* 已完成的最后节点日期 */
 var lastDate=dates[dates.length-1];
 /* 判断：今天是否等于某个已计划的节点日 */
 /* 计划节点：从 lastDate 往后推 */
 var lvl=done[lastDate]||4;
 var planNext=addDaysStr(lastDate, lvl>=4?15: nextOf(lastDate,first));
 return todayS>=planNext;
}
function nextOf(lastDate,first){
 /* 距首背已过天数 */
 var past=daysBetween(first,lastDate);
 var seq=[0].concat(NODES);
 /* 找 past 在序列中的位置，返回下一个节点与 past 的差 */
 for(var i=0;i<seq.length;i++){if(seq[i]===past)return (seq[i+1]!==undefined?seq[i+1]-past:15);}
 /* past 不在节点上（说明是 15 天节奏的延续） */
 return 15;
}
function dueList(){
 var out=[];
 points.forEach(function(p){
  if(isDue(p.id))out.push({point:p,level:lastLevel(p.id),first:firstDate(p.id)});
 });
 out.sort(function(a,b){return (a.first||'').localeCompare(b.first||'');});
 return out;
}

/* ===== 渲染 ===== */
function render(){
 renderCountdown();
 renderDue();
 renderHeat();
 renderStats();
 renderChapters();
}

function renderCountdown(){
 var exam=new Date(EXAM_Y,EXAM_M,EXAM_D);exam.setHours(0,0,0,0);
 var days=Math.ceil((exam-today)/86400000);
 var n=document.getElementById('cdNum');
 var sub=document.getElementById('cdSub');
 if(days>0){n.textContent=days+' 天';sub.textContent='2026 年 12 月 19 日 · 稳住，能上';}
 else if(days===0){n.textContent='就是今天';sub.textContent='去考吧，你已经准备好了';}
 else {n.textContent='已开考';sub.textContent='别看了，复盘下一站';}
 var t=ts();
 document.getElementById('cdToday').textContent=reviews.filter(function(r){return r.review_date===t;}).length;
 document.getElementById('cdMastered').textContent=points.filter(function(p){return lastLevel(p.id)>=4;}).length;
 document.getElementById('cdDue').textContent=dueList().length;
 /* 连续打卡 */
 var streak=0;var cur=t;
 while(reviews.some(function(r){return r.review_date===cur;})){streak++;cur=addDaysStr(cur,-1);}
 document.getElementById('cdStreak').textContent=streak;
}

function renderDue(){
 var list=dueList();
 var box=document.getElementById('dueList');
 document.getElementById('dueTag').textContent=list.length?'共 '+list.length+' 条':'今天没有';
 if(!list.length){box.innerHTML="<div class='empty'>🎉 今天没有待复习的条目，去背点新的吧</div>";return;}
 var h='';
 list.forEach(function(o){
  var p=o.point;var overdue=o.first&&o.first<ts()&&lastLevel(p.id)>0;
  h+="<div class='due-item'>"
   +"<span class='nm'>"+esc(p.name)+"</span>"
   +"<span class='meta "+((lastLevel(p.id)===0||overdue)?'over':'soon')+"'>"+esc(chName(p.chapter_id))+(o.first?' · 首背 '+o.first:' · 待首背')+(overdue?' · 已逾期':'')+"</span>"
   +"<span class='lvl-btns'>"
   +"<button class='l1' onclick='quickReview("+p.id+",1)' title='遗忘'>遗</button>"
   +"<button class='l2' onclick='quickReview("+p.id+",2)' title='模糊'>糊</button>"
   +"<button class='l3' onclick='quickReview("+p.id+",3)' title='熟悉'>熟</button>"
   +"<button class='l4' onclick='quickReview("+p.id+",4)' title='背熟'>背</button>"
   +"<button class='l5' onclick='quickReview("+p.id+",5)' title='卡壳'>卡</button>"
   +"</span></div>";
 });
 box.innerHTML=h;
}

function renderStats(){
 document.getElementById('sPoint').textContent=points.length;
 var done=points.filter(function(p){return lastLevel(p.id)>0;}).length;
 document.getElementById('sDone').textContent=done;
 var m=points.filter(function(p){return lastLevel(p.id)>=4;}).length;
 document.getElementById('sRate').textContent=done?Math.round(m/done*100)+'%':'0%';
 document.getElementById('sTotal').textContent=reviews.length;
}

function renderHeat(){
 var grid=document.getElementById('heatGrid');var mon=document.getElementById('heatMonth');
 grid.innerHTML='';mon.innerHTML='';
 var start=new Date(today);start.setDate(today.getDate()-23 * 7);start.setDate(start.getDate()-start.getDay());start.setHours(0,0,0,0);
 var dayMap={};
 reviews.forEach(function(r){var k=r.review_date;if(!dayMap[k]||dayMap[k]<r.level)dayMap[k]=r.level;});
 var ml=[];var lastM=-1;
 for(var w=0;w<24;w++){
  var d0=new Date(start);d0.setDate(start.getDate()+w*7);d0.setHours(0,0,0,0);
  var m=d0.getMonth();
  ml.push(m!==lastM?d0.toLocaleDateString('zh-CN',{month:'short'}):'');lastM=m;
 }
 ml.forEach(function(m){mon.innerHTML+='<span>'+m+'</span>';});
 for(var w2=0;w2<24;w2++){
  var col='<div class="heat-col">';
  for(var dow=0;dow<7;dow++){
   var d=new Date(start);d.setDate(start.getDate()+w2 * 7+dow);d.setHours(0,0,0,0);
   var k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
   var l=dayMap[k]||0;
   var cnt=reviews.filter(function(r){return r.review_date===k;}).length;
   col+='<div class="heat-cell'+(l?'" data-l="'+l+'"':'"')+' data-date="'+k+'" data-cnt="'+cnt+'" data-lvl="'+(l?LVL[l]:'未背')+'"></div>';
  }
  col+='</div>';grid.innerHTML+=col;
 }
 bindTip();
}
function bindTip(){
 var tip=document.getElementById('tip');
 document.querySelectorAll('.heat-cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){tip.innerHTML=c.dataset.date+' · '+c.dataset.cnt+' 条 · 最高 '+c.dataset.lvl;tip.classList.add('on');});
  c.addEventListener('mousemove',function(e){tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-32+'px';});
  c.addEventListener('mouseleave',function(){tip.classList.remove('on');});
  c.addEventListener('click',function(){document.getElementById('search').value=c.dataset.date;doSearch(c.dataset.date);});
 });
}

function renderChapters(){
 var box=document.getElementById('chapterList');var h='';
 tree().forEach(function(node){
  node.chapters.forEach(function(c){
   var cps=points.filter(function(p){return p.chapter_id===c.id;});
   var done=cps.filter(function(p){return lastLevel(p.id)>0;}).length;
   var opts='';chapters.forEach(function(cc){opts+='<option value="'+cc.id+'"'+(cc.id===c.id?' selected':'')+'>'+esc(cc.name)+'</option>';});
   h+="<div class='chapter open' id='ch_"+c.id+"'>"
    +"<div class='ch-top' onclick='toggleCh("+c.id+")'>"
    +"<svg class='caret' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5'><polyline points='9 18 15 12 9 6'/></svg>"
    +"<h2>"+esc(c.name)+"</h2>"
    +"<span class='cnt'>"+done+' / '+cps.length+"</span>"
    +"</div>"
    +"<div class='ch-body'>"
    +pointGroupHtml(cps,'名词解释')+pointGroupHtml(cps,'简答')+pointGroupHtml(cps,'论述')+pointGroupHtml(cps,'其他')
    +"</div></div>";
  });
 });
 box.innerHTML=h;
}
function pointGroupHtml(cps,cat){
 var list=cps.filter(function(p){return (p.category||'简答')===cat;});
 if(!list.length)return '';
 var missNote=(cat==='简答'&&list.some(function(p){return p.name.indexOf('应对措施')>-1||p.name.indexOf('存在的问题')>-1;}));
 var h="<h4>"+cat+"（"+list.length+"）"+((cat==='简答'&&chNameOf(list[0].chapter_id).indexOf('第三章')>-1)?' · 含待补充条目':'')+"</h4>";
 list.forEach(function(p){
  var l=lastLevel(p.id);
  h+="<div class='point'>"
   +"<span class='lvl'"+(l?' data-l="'+l+'"':'')+"></span>"
   +"<div class='info'>"
   +"<div class='nm'>"+esc(p.name)+" "+tagOf(cat)+"</div>"
   +"<div class='prev'>"+(clean(p.content)||'<span style="color:var(--sub)">暂无内容，点编辑添加</span>')+"</div>"
   +"</div>"
   +"<div class='acts'>"
   +"<button class='ghost sm' onclick='openPointModal("+p.id+")'>编辑</button>"
   +"<button class='soft sm' onclick='quickReview("+p.id+",4)'>背熟</button>"
   +"<button class='soft sm' style='color:var(--l2)' onclick='delPoint("+p.id+")'>删</button>"
   +"</div></div>";
 });
 return h;
}
function chName(id){var c=chapters.filter(function(x){return x.id===id;})[0];return c?c.name:'';}
function tagOf(c){if(c==='名词解释')return "<span class='tag tm'>名词解释</span>";if(c==='简答')return "<span class='tag ts'>简答</span>";if(c==='论述')return "<span class='tag td'>论述</span>";return "<span class='tag to'>其他</span>";}
function toggleCh(id){document.getElementById('ch_'+id).classList.toggle('open');}

/* ===== 知识点增删改 ===== */
var curPoint=null;
function openPointModal(pointId){
 var p=pointId?points.filter(function(x){return x.id===pointId;})[0]:null;
 curPoint=p||null;
 var opts='';chapters.forEach(function(c){opts+='<option value="'+c.id+'"'+(p&&p.chapter_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>';});
 var cat=p?p.category:'简答';
 var html="<h3>"+(p?'编辑知识点':'新增知识点')+"</h3>"
  +"<div class='field'><label>所属章节</label><select id='fCh'>"+opts+"</select></div>"
  +"<div class='field'><label>知识点名称</label><input id='fName' value='"+(p?esc(p.name):'')+"' placeholder='如：绿色贸易壁垒对我国外贸的影响'></div>"
  +"<div class='field'><label>题型</label><select id='fCat'>"
  +['名词解释','简答','论述','其他'].map(function(c){return '<option'+(c===cat?' selected':'')+'>'+c+'</option>';}).join('')+"</select></div>"
  +"<div class='field'><label>具体内容（富文本）</label><div class='rich'>"
  +"<div class='tb'>"
  +"<button onclick='fmt(\"bold\")'><b>B</b></button><button onclick='fmt(\"italic\")'><i>I</i></button>"
  +"<button onclick='fmt(\"underline\")'><u>U</u></button><button onclick='fmt(\"insertUnorderedList\")'>• 列表</button>"
  +"<button onclick='fmt(\"insertOrderedList\")'>1. 列表</button><button onclick='fmt(\"formatBlock\",\"h3\")'>标题</button>"
  +"</div>"
  +"<div id='fContent' contenteditable data-ph='在这里写具体内容，支持加粗、列表…'>"+(p?p.content:'')+"</div>"
  +"</div></div>"
  +"<div class='modal-acts'><button class='ghost' onclick='closeModal()'>取消</button><button onclick='submitPoint()'>"+(p?'保存':'添加')+"</button></div>";
 document.getElementById('modal').innerHTML=html;
 document.getElementById('mask').classList.add('on');
}
function fmt(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('fContent').focus();}
function submitPoint(){
 var chapter_id=+document.getElementById('fCh').value;
 var name=document.getElementById('fName').value.trim();
 var category=document.getElementById('fCat').value;
 var content=document.getElementById('fContent').innerHTML.trim();
 if(!name){toast('请填写知识点名称');return;}
 var body={chapter_id:chapter_id,name:name,category:category,content:content};
 if(curPoint){
  Object.assign(curPoint,body);
  rest('/kb_points?id=eq.'+curPoint.id,'PATCH',body).then(function(){toast('已更新');closeModal();loadAll();}).catch(function(e){toast('保存失败');});
 }else{
  rest('/kb_points?select=*','POST',body).then(function(r){
   var np=r&&r[0];
   if(np)return rest('/kb_reviews','POST',{point_id:np.id,review_date:ts(),level:4,note:'首背'}).then(function(){toast('已添加，视为首背');});
   toast('已添加');
  }).catch(function(e){toast('添加失败：'+(e.message||''));}).then(function(){closeModal();loadAll();});
 }
}
function delPoint(id){
 if(!confirm('确定删除？该知识点的全部背诵记录会一起删除'))return;
 rest('/kb_reviews?point_id=eq.'+id,'DELETE').then(function(){
  return rest('/kb_points?id=eq.'+id,'DELETE');
 }).then(function(){points=points.filter(function(p){return p.id!==id;});reviews=reviews.filter(function(r){return r.point_id!==id;});render();toast('已删除');})
 .catch(function(e){toast('删除失败');});
}
function closeModal(){document.getElementById('mask').classList.remove('on');curPoint=null;}

/* ===== 复习记录 ===== */
function quickReview(pointId,level){
 var t=ts();
 var exist=reviews.filter(function(r){return r.point_id===pointId&&r.review_date===t;})[0];
 if(exist){
  rest('/kb_reviews?id=eq.'+exist.id,'PATCH',{level:level}).then(function(){exist.level=level;render();toast('已更新为'+LVL[level]);});
 }else{
  rest('/kb_reviews?select=*','POST',{point_id:pointId,review_date:t,level:level}).then(function(r){
   if(r&&r[0])reviews.unshift(r[0]);else reviews.push({point_id:pointId,review_date:t,level:level});
   render();toast('已记录 '+LVL[level]);
  }).catch(function(e){toast('记录失败');});
 }
}

/* ===== 搜索 ===== */
document.getElementById('search').addEventListener('input',function(e){doSearch(e.target.value.trim());});
function doSearch(q){
 q=(q||'').toLowerCase();
 document.querySelectorAll('.chapter').forEach(function(ch){
  var hit=false;
  ch.querySelectorAll('.point').forEach(function(p){
   var ok=!q||p.textContent.toLowerCase().indexOf(q)>-1;
   p.style.display=ok?'':'none';if(ok)hit=true;
  });
  ch.classList.add('open');ch.style.display=hit||!q?'':'none';
 });
}

/* ===== 主题 ===== */
function toggleTheme(){
 document.body.classList.toggle('light');
 var light=document.body.classList.contains('light');
 localStorage.setItem('kb_theme',light?'light':'dark');
 document.getElementById('darkBtn').textContent=light?'🌙':'☀️';
}
if(localStorage.getItem('kb_theme')==='light'){document.body.classList.add('light');document.getElementById('darkBtn').textContent='🌙';}

/* ===== 提示 ===== */
var tt=null;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},1800);}

/* ===== 启动 ===== */
(function(){if(localStorage.getItem('kb_login')==='1'){loadAll();return;}
 var p=prompt('请输入访问密码（默认 beishu2024）','');
 if(p===PASSWORD){localStorage.setItem('kb_login','1');loadAll();}
 else{toast('密码错误');setTimeout(function(){location.reload();},700);}
})();
